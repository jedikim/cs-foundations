<svg viewBox="0 0 760 408" xmlns="http://www.w3.org/2000/svg">
  <title>셸은 PATH에 적힌 폴더를 앞에서부터 찾아 처음 나온 실행 파일을 쓰고, 목록에 없는 폴더는 찾지 않는다</title>

  <rect class="box blue" x="20" y="20" width="120" height="40" rx="10"/>
  <text class="t-mono t-b mid" x="80" y="45">$ python3</text>
  <path class="ln" d="M146 40 H168" marker-end="url(#ah)"/>
  <text class="t-mono" x="180" y="45">PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin</text>
  <text class="t-s" x="582" y="45">앞에서부터 찾는다</text>

  <rect class="panel green" x="20" y="84" width="540" height="62" rx="12"/>
  <circle class="badge green" cx="46" cy="115" r="12"/><text class="badge-t" x="46" y="119.500">1</text>
  <text class="t-mono t-b" x="68" y="120">/opt/homebrew/bin</text>
  <rect class="box green" x="230" y="93" width="100" height="44" rx="8"/>
  <text class="t-mono t-b mid" x="280" y="112">python3</text>
  <text class="t-xs mid" x="280" y="129">버전 3.12</text>
  <rect class="box" x="340" y="93" width="100" height="44" rx="8"/>
  <text class="t-mono mid" x="390" y="120">git</text>
  <use href="#i-check" x="574" y="97" width="24" height="24" class="ic green"/>
  <text class="t-b tc-green" x="604" y="114">여기서 찾음</text>
  <text class="t-xs" x="604" y="132">찾기를 멈추고 실행</text>

  <rect class="panel gray" x="20" y="158" width="540" height="62" rx="12"/>
  <circle class="badge" cx="46" cy="189" r="12"/><text class="badge-t" x="46" y="193.500">2</text>
  <text class="t-mono" x="68" y="194">/usr/local/bin</text>
  <rect class="box" x="230" y="167" width="100" height="44" rx="8"/>
  <text class="t-mono mid" x="280" y="194">docker</text>
  <text class="t-s" x="604" y="194">가 보지 않음</text>

  <rect class="panel gray" x="20" y="232" width="540" height="62" rx="12"/>
  <circle class="badge" cx="46" cy="263" r="12"/><text class="badge-t" x="46" y="267.500">3</text>
  <text class="t-mono" x="68" y="268">/usr/bin</text>
  <rect class="ghost dash" x="230" y="241" width="100" height="44" rx="8"/>
  <text class="t-mono mid tc-muted" x="280" y="260">python3</text>
  <text class="t-xs mid" x="280" y="277">버전 3.9</text>
  <rect class="box" x="340" y="241" width="100" height="44" rx="8"/>
  <text class="t-mono mid" x="390" y="268">ssh</text>
  <text class="t-s" x="604" y="262">가 보지 않음</text>
  <text class="t-xs tc-warm" x="604" y="280">3.9는 가려진다</text>

  <path class="ln thin muted dash" d="M20 310 H740"/>

  <rect class="ghost dash" x="20" y="326" width="540" height="62" rx="12"/>
  <use href="#i-cross" x="34" y="345" width="24" height="24" class="ic red"/>
  <text class="t-mono" x="68" y="354">~/tools/bin</text>
  <text class="t-xs tc-red" x="68" y="373">PATH에 없는 폴더</text>
  <rect class="box" x="230" y="335" width="100" height="44" rx="8"/>
  <text class="t-mono mid" x="280" y="362">mytool</text>
  <text class="t-mono" x="576" y="352">$ mytool</text>
  <text class="t-b tc-red" x="576" y="374">command not found</text>
</svg>
