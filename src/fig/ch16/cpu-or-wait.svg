<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg">
  <title>us가 높으면 CPU가 계산하느라 바쁜 것이고, wa와 디스크 사용률이 높으면 디스크를 기다리는 것이다</title>
  <rect class="panel blue" x="20" y="20" width="350" height="290" rx="16"/>
  <text class="t-l" x="40" y="52">A. 계산하느라 바쁨</text>
  <text class="t-xs" x="40" y="78">top 화면</text>
  <text class="t-mono t-b" x="40" y="101">us<tspan class="t-xs" dx="8">계산</tspan></text>
  <rect class="s-gray" x="150" y="86" width="160" height="20" rx="4"/>
  <rect class="solid blue" x="150" y="86" width="155" height="20" rx="4"/>
  <text class="t-mono t-b end" x="354" y="101">97%</text>
  <text class="t-mono t-b" x="40" y="129">wa<tspan class="t-xs" dx="8">디스크 대기</tspan></text>
  <rect class="s-gray" x="150" y="114" width="160" height="20" rx="4"/>
  <rect class="solid warm" x="150" y="114" width="3" height="20" rx="4"/>
  <text class="t-mono t-b end" x="354" y="129">1%</text>
  <text class="t-xs" x="40" y="158">iostat -x 화면</text>
  <text class="t-mono t-b" x="40" y="181">%util<tspan class="t-xs" dx="8">디스크</tspan></text>
  <rect class="s-gray" x="150" y="166" width="160" height="20" rx="4"/>
  <rect class="solid warm" x="150" y="166" width="5" height="20" rx="4"/>
  <text class="t-mono t-b end" x="354" y="181">3%</text>
  <rect class="box" x="40" y="204" width="310" height="90" rx="10"/>
  <text class="t-b" x="56" y="230">CPU가 병목</text>
  <text class="t-s" x="56" y="254">처방: 계산량을 줄이거나</text>
  <text class="t-s" x="56" y="276">여러 코어에 나누기</text>

  <rect class="panel warm" x="390" y="20" width="350" height="290" rx="16"/>
  <text class="t-l" x="410" y="52">B. 디스크를 기다림</text>
  <text class="t-xs" x="410" y="78">top 화면</text>
  <text class="t-mono t-b" x="410" y="101">us<tspan class="t-xs" dx="8">계산</tspan></text>
  <rect class="s-gray" x="520" y="86" width="160" height="20" rx="4"/>
  <rect class="solid blue" x="520" y="86" width="10" height="20" rx="4"/>
  <text class="t-mono t-b end" x="724" y="101">6%</text>
  <text class="t-mono t-b" x="410" y="129">wa<tspan class="t-xs" dx="8">디스크 대기</tspan></text>
  <rect class="s-gray" x="520" y="114" width="160" height="20" rx="4"/>
  <rect class="solid warm" x="520" y="114" width="114" height="20" rx="4"/>
  <text class="t-mono t-b end" x="724" y="129">71%</text>
  <text class="t-xs" x="410" y="158">iostat -x 화면</text>
  <text class="t-mono t-b" x="410" y="181">%util<tspan class="t-xs" dx="8">디스크</tspan></text>
  <rect class="s-gray" x="520" y="166" width="160" height="20" rx="4"/>
  <rect class="solid warm" x="520" y="166" width="157" height="20" rx="4"/>
  <text class="t-mono t-b end" x="724" y="181">98%</text>
  <rect class="box" x="410" y="204" width="310" height="90" rx="10"/>
  <text class="t-b" x="426" y="230">디스크 I/O가 병목</text>
  <text class="t-s" x="426" y="254">처방: 읽고 쓰는 횟수 줄이기,</text>
  <text class="t-s" x="426" y="276">모아서 쓰기, 캐시 살리기</text>
</svg>
