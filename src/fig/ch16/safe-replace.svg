<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg">
  <title>파일을 직접 덮어쓰다 죽으면 반쪽 파일이 남지만, 임시 파일에 다 쓴 뒤 이름을 바꾸면 언제 죽어도 온전한 파일이 남는다</title>

  <text class="t-b" x="20" y="74">직접 덮어쓰기</text>
  <rect class="box green" x="160" y="40" width="170" height="58" rx="10"/>
  <text class="t-mono" x="174" y="63"><tspan class="t-b">settings.json</tspan><tspan x="174" dy="22">{"volume": 7}</tspan></text>
  <path class="ln muted" d="M335 69 H358" marker-end="url(#ah-muted)"/>
  <rect class="box red" x="365" y="40" width="170" height="58" rx="10"/>
  <text class="t-mono" x="379" y="63"><tspan class="t-b">settings.json</tspan><tspan x="379" dy="22" class="tc-red">{"volu</tspan></text>
  <path class="ln red" d="M540 69 H563" marker-end="url(#ah-red)"/>
  <use href="#i-warn" x="574" y="52" width="34" height="34" class="ic red"/>
  <text class="t-s t-b tc-red" x="618" y="64">다시 켜면</text>
  <text class="t-s t-b tc-red" x="618" y="84">설정을 못 읽음</text>
  <text class="t-xs mid" x="245" y="116">옛 설정</text>
  <text class="t-xs mid" x="450" y="116">쓰는 도중 프로그램 종료</text>

  <path class="ln thin muted dash" d="M20 134 H740"/>

  <text class="t-b" x="20" y="208">임시 파일에 쓰고</text>
  <text class="t-b" x="20" y="230">이름 바꾸기</text>

  <rect class="box green" x="160" y="152" width="170" height="58" rx="10"/>
  <text class="t-mono" x="174" y="175"><tspan class="t-b">settings.json</tspan><tspan x="174" dy="22">{"volume": 7}</tspan></text>
  <rect class="box gray" x="160" y="218" width="170" height="58" rx="10"/>
  <text class="t-mono" x="174" y="241"><tspan class="t-b">settings.json.tmp</tspan><tspan x="174" dy="22" class="tc-muted">{"volu</tspan></text>

  <path class="ln muted" d="M335 214 H358" marker-end="url(#ah-muted)"/>

  <rect class="box green" x="365" y="152" width="170" height="58" rx="10"/>
  <text class="t-mono" x="379" y="175"><tspan class="t-b">settings.json</tspan><tspan x="379" dy="22">{"volume": 7}</tspan></text>
  <rect class="box blue" x="365" y="218" width="170" height="58" rx="10"/>
  <text class="t-mono" x="379" y="241"><tspan class="t-b">settings.json.tmp</tspan><tspan x="379" dy="22">{"volume": 9}</tspan></text>

  <path class="ln blue" d="M540 247 L564 196" marker-end="url(#ah-blue)"/>

  <rect class="box green" x="570" y="152" width="170" height="58" rx="10"/>
  <text class="t-mono" x="584" y="175"><tspan class="t-b">settings.json</tspan><tspan x="584" dy="22">{"volume": 9}</tspan></text>
  <use href="#i-check" x="574" y="224" width="30" height="30" class="ic green"/>
  <text class="t-s t-b tc-green" x="612" y="236">언제 죽어도</text>
  <text class="t-s t-b tc-green" x="612" y="256">온전한 파일이 남음</text>

  <circle class="badge" cx="172" cy="304" r="11"/><text class="badge-t" x="172" y="308.500">1</text>
  <text class="t-s" x="190" y="309">임시 파일에 쓰기</text>
  <circle class="badge" cx="377" cy="304" r="11"/><text class="badge-t" x="377" y="308.500">2</text>
  <text class="t-s" x="395" y="309">다 쓰고 fsync</text>
  <circle class="badge" cx="582" cy="304" r="11"/><text class="badge-t" x="582" y="308.500">3</text>
  <text class="t-s" x="600" y="309">이름 바꾸기 (한순간)</text>
</svg>
