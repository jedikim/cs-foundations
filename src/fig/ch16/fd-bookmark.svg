<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg">
  <title>프로그램은 번호표 3번만 쥐고 있고, 커널의 장부가 어느 파일을 어디까지 읽었는지 책갈피로 기억한다</title>
  <text class="t-s t-b mid" x="105" y="30">프로그램이 받은 번호표</text>
  <text class="t-s t-b mid" x="365" y="30">커널의 대여 장부</text>
  <text class="t-s t-b mid" x="618" y="30">창고의 파일 memo.txt</text>

  <rect class="box gray" x="20" y="46" width="170" height="34" rx="8"/>
  <text class="t-s" x="36" y="68"><tspan class="t-mono t-b">0</tspan><tspan dx="16">키보드 입력</tspan></text>
  <rect class="box gray" x="20" y="86" width="170" height="34" rx="8"/>
  <text class="t-s" x="36" y="108"><tspan class="t-mono t-b">1</tspan><tspan dx="16">화면 출력</tspan></text>
  <rect class="box gray" x="20" y="126" width="170" height="34" rx="8"/>
  <text class="t-s" x="36" y="148"><tspan class="t-mono t-b">2</tspan><tspan dx="16">오류 출력</tspan></text>
  <rect class="box blue" x="20" y="166" width="170" height="34" rx="8"/>
  <text class="t-s" x="36" y="188"><tspan class="t-mono t-b tc-blue">3</tspan><tspan dx="16" class="t-mono">memo.txt</tspan></text>

  <path class="ln blue" d="M196 183 H262" marker-end="url(#ah-blue)"/>

  <rect class="box yellow" x="270" y="128" width="190" height="110" rx="12"/>
  <text class="t-b" x="288" y="154">3번의 기록</text>
  <text class="t-s" x="288" y="178">파일: memo.txt</text>
  <text class="t-s" x="288" y="200">용도: 읽기</text>
  <text class="t-b tc-warm" x="288" y="224">책갈피: 2</text>

  <path class="ln muted" d="M466 170 H500" marker-end="url(#ah-muted)"/>

  <rect class="box gray" x="510" y="150" width="36" height="40" rx="5"/>
  <text class="t-mono mid tc-muted" x="528" y="175">A</text>
  <rect class="box gray" x="546" y="150" width="36" height="40" rx="5"/>
  <text class="t-mono mid tc-muted" x="564" y="175">B</text>
  <rect class="box warm" x="582" y="150" width="36" height="40" rx="5"/>
  <text class="t-mono t-b mid" x="600" y="175">C</text>
  <rect class="box warm" x="618" y="150" width="36" height="40" rx="5"/>
  <text class="t-mono t-b mid" x="636" y="175">D</text>
  <rect class="box warm" x="654" y="150" width="36" height="40" rx="5"/>
  <text class="t-mono t-b mid" x="672" y="175">E</text>
  <rect class="box warm" x="690" y="150" width="36" height="40" rx="5"/>
  <text class="t-mono t-b mid" x="708" y="175">F</text>

  <text class="t-s t-b tc-warm mid" x="582" y="100">책갈피</text>
  <path class="ln warm" d="M582 108 V142" marker-end="url(#ah-warm)"/>
  <text class="t-xs mid" x="546" y="210">이미 읽음</text>
  <text class="t-xs mid" x="654" y="210">다음에 읽을 곳</text>

  <text class="t-mono tc-muted" x="510" y="240">read(2) → "AB"</text>
  <text class="t-xs" x="650" y="240">방금</text>
  <text class="t-mono t-b" x="510" y="262">read(2) → "CD"</text>
  <text class="t-xs" x="650" y="262">다음 호출</text>
</svg>
