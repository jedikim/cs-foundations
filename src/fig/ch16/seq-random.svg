<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg">
  <title>같은 8칸을 읽어도 붙어 있는 칸을 차례로 읽으면 한 번만 찾아가면 되고, 흩어진 칸을 읽으면 칸마다 새로 찾아가야 한다</title>
