<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg">
  <title>첫 방문에는 본문 전체를 받고, 유효 기간 안에는 서버에 묻지 않으며, 기간이 지나면 바뀌었는지만 물어 304 응답을 받는다</title>

  <use href="#i-browser" x="174" y="14" width="32" height="32" class="ic blue"/>
  <text class="t-b mid" x="190" y="64">브라우저</text>
  <use href="#i-server" x="564" y="14" width="32" height="32" class="ic green"/>
  <text class="t-b mid" x="580" y="64">서버</text>
  <text class="t-s t-b" x="622" y="64">내려받은 양</text>
  <path class="ln thin muted" d="M190 76 V322 M580 76 V322"/>

  <circle class="badge blue" cx="32" cy="100" r="12"/><text class="badge-t" x="32" y="104.500">1</text>
  <text class="t-b" x="52" y="105">첫 방문</text>
  <text class="t-s" x="52" y="125">사본이 없다</text>
  <path class="ln blue" d="M196 100 H572" marker-end="url(#ah-blue)"/>
  <text class="t-mono mid" x="385" y="90">GET /menu</text>
  <path class="ln green" d="M574 142 H198" marker-end="url(#ah-green)"/>
  <text class="t-mono mid" x="385" y="132">200 OK · ETag: "v7" · max-age=3600</text>
  <rect class="solid green" x="622" y="108" width="110" height="26" rx="5"/>
  <text class="t-on t-b mid" x="677" y="126">48KB</text>

  <circle class="badge" cx="32" cy="194" r="12"/><text class="badge-t" x="32" y="198.500">2</text>
  <text class="t-b" x="52" y="199">10분 뒤</text>
  <text class="t-s" x="52" y="219">유효 기간 안</text>
  <rect class="box yellow" x="200" y="174" width="300" height="40" rx="10"/>
  <text class="t-s mid" x="350" y="199">서버에 묻지 않고 사본을 쓴다</text>
  <text class="t-mono t-b" x="622" y="199">0KB</text>
  <text class="t-xs" x="662" y="199">요청도 없음</text>

  <circle class="badge blue" cx="32" cy="258" r="12"/><text class="badge-t" x="32" y="262.500">3</text>
  <text class="t-b" x="52" y="263">2시간 뒤</text>
  <text class="t-s" x="52" y="283">기간이 지났다</text>
  <path class="ln blue" d="M196 258 H572" marker-end="url(#ah-blue)"/>
  <text class="t-mono mid" x="385" y="248">GET /menu · If-None-Match: "v7"</text>
  <path class="ln green" d="M574 300 H198" marker-end="url(#ah-green)"/>
  <text class="t-mono t-b mid tc-green" x="360" y="290">304 Not Modified</text>
  <text class="t-xs" x="436" y="290">본문 없음</text>
  <rect class="solid green" x="622" y="266" width="5" height="26" rx="2"/>
  <text class="t-mono t-b" x="636" y="284">0.2KB</text>
  <text class="t-xs" x="692" y="284">헤더만</text>
</svg>
