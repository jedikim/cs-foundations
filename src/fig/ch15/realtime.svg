  <text class="t-xs end" x="228" y="56">브라우저</text>
  <text class="t-xs end" x="228" y="104">서버</text>
  <path class="ln thin muted" d="M236 52 H730 M236 100 H730"/>
  <path class="ln blue" d="M260 56 L274 92" marker-end="url(#ah-blue)"/>
  <path class="ln muted" d="M290 96 L304 60" marker-end="url(#ah-muted)"/>
  <path class="ln blue" d="M380 56 L394 92" marker-end="url(#ah-blue)"/>
  <path class="ln muted" d="M410 96 L424 60" marker-end="url(#ah-muted)"/>
