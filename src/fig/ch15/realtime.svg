  <text class="t-xs mid" x="454" y="154">50%</text>
  <text class="t-xs mid" x="544" y="154">80%</text>
  <text class="t-xs t-b mid tc-green" x="664" y="154">완료</text>

  <text class="t-l" x="20" y="288">WebSocket</text>
  <text class="t-s" x="20" y="310">연결을 열어 두고</text>
  <text class="t-s" x="20" y="328">양쪽이 아무 때나</text>
  <text class="t-xs end" x="228" y="280">브라우저</text>
  <text class="t-xs end" x="228" y="328">서버</text>
