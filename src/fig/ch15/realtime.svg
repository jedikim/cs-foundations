<svg viewBox="0 0 760 372" xmlns="http://www.w3.org/2000/svg">
  <title>폴링은 브라우저가 계속 물어보고, SSE는 한 번 물은 뒤 서버가 계속 내려보내며, WebSocket은 연결을 열어 두고 양쪽이 아무 때나 보낸다</title>

  <text class="t-l" x="20" y="68">폴링</text>
