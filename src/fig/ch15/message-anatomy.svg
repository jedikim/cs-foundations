<svg viewBox="0 0 760 332" xmlns="http://www.w3.org/2000/svg">
  <title>HTTP 요청과 응답은 둘 다 시작줄, 헤더, 빈 줄, 본문 순서로 적힌 글자 묶음이다</title>

  <rect class="panel blue" x="20" y="20" width="350" height="292" rx="14"/>
  <circle class="badge blue" cx="46" cy="46" r="12"/><text class="badge-t" x="46" y="50.500">1</text>
  <text class="t-l" x="66" y="52">요청 = 주문서</text>
  <text class="t-s end" x="356" y="51">브라우저 → 서버</text>

  <text class="t-xs t-b" x="36" y="84">시작줄: 무엇을, 어디에</text>
  <rect class="box" x="34" y="92" width="322" height="36" rx="8"/>
  <text class="t-mono" x="46" y="115"><tspan class="tc-blue t-b">POST</tspan> <tspan class="tc-warm t-b">/orders</tspan> HTTP/1.1</text>

  <text class="t-xs t-b" x="36" y="150">헤더: 덧붙이는 메모</text>
  <rect class="box" x="34" y="158" width="322" height="58" rx="8"/>
  <text class="t-mono" x="46" y="181">Host: pizza.example.com</text>
  <text class="t-mono" x="46" y="203">Content-Type: application/json</text>

  <text class="t-xs" x="46" y="235">(빈 줄: 헤더가 끝났다는 표시)</text>

  <text class="t-xs t-b" x="36" y="258">본문: 내용물</text>
  <rect class="box" x="34" y="266" width="322" height="36" rx="8"/>
  <text class="t-mono" x="46" y="289">{"menu":"pizza","size":"L"}</text>

  <rect class="panel green" x="390" y="20" width="350" height="292" rx="14"/>
  <circle class="badge green" cx="416" cy="46" r="12"/><text class="badge-t" x="416" y="50.500">2</text>
  <text class="t-l" x="436" y="52">응답 = 답변서</text>
  <text class="t-s end" x="726" y="51">서버 → 브라우저</text>

  <text class="t-xs t-b" x="406" y="84">상태줄: 어떻게 됐는지</text>
  <rect class="box" x="404" y="92" width="322" height="36" rx="8"/>
  <text class="t-mono" x="416" y="115">HTTP/1.1 <tspan class="tc-green t-b">201 Created</tspan></text>

  <text class="t-xs t-b" x="406" y="150">헤더: 덧붙이는 메모</text>
  <rect class="box" x="404" y="158" width="322" height="58" rx="8"/>
  <text class="t-mono" x="416" y="181">Content-Type: application/json</text>
  <text class="t-mono" x="416" y="203">Location: /orders/1042</text>

  <text class="t-xs" x="416" y="235">(빈 줄)</text>

  <text class="t-xs t-b" x="406" y="258">본문: 내용물</text>
  <rect class="box" x="404" y="266" width="322" height="36" rx="8"/>
  <text class="t-mono" x="416" y="289">{"id":1042,"status":"접수"}</text>
</svg>
