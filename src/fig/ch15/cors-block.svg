<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg">
  <title>다른 출처로 보낸 요청은 서버에 도착하고 응답도 돌아오지만, 허락 헤더가 없으면 브라우저가 그 응답을 스크립트에 넘기지 않는다</title>

  <rect class="panel blue" x="20" y="20" width="410" height="240" rx="14"/>
  <use href="#i-browser" x="34" y="30" width="32" height="32" class="ic blue"/>
  <text class="t-l" x="74" y="53">브라우저</text>

  <rect class="box" x="36" y="76" width="180" height="168" rx="10"/>
  <text class="t-b" x="50" y="102">페이지의 스크립트</text>
  <text class="t-xs" x="50" y="128">페이지를 받아 온 곳</text>
  <text class="t-mono t-b tc-blue" x="50" y="148">localhost:3000</text>
  <text class="t-xs" x="50" y="180">데이터를 받아 오려는 곳</text>
  <text class="t-mono t-b tc-green" x="50" y="200">localhost:8000</text>
  <text class="t-xs" x="50" y="228">포트가 다르면 다른 출처</text>

  <rect class="box warm" x="296" y="76" width="118" height="168" rx="10"/>
  <use href="#i-shield" x="337" y="88" width="36" height="36" class="ic warm"/>
  <text class="t-b mid" x="355" y="148">출처 검사</text>
  <text class="t-xs mid" x="355" y="170">응답에 허락</text>
  <text class="t-xs mid" x="355" y="186">헤더가 있나?</text>

  <path class="ln blue" d="M221 112 H289" marker-end="url(#ah-blue)"/>
  <circle class="badge blue" cx="254" cy="112" r="12"/><text class="badge-t" x="254" y="116.500">1</text>

  <path class="ln red dash" d="M290 208 H223" marker-end="url(#ah-red)"/>
  <circle class="badge red" cx="258" cy="208" r="12"/><text class="badge-t" x="258" y="212.500">4</text>
  <text class="t-xs t-b mid tc-red" x="256" y="234">넘기지 않음</text>

  <rect class="box green" x="570" y="76" width="170" height="168" rx="10"/>
  <use href="#i-server" x="635" y="88" width="40" height="40" class="ic green"/>
  <text class="t-l mid" x="655" y="154">API 서버</text>
  <text class="t-mono mid" x="655" y="178">localhost:8000</text>
  <text class="t-xs mid" x="655" y="204">요청을 받아</text>
  <text class="t-xs mid" x="655" y="220">정상 처리했다</text>

  <path class="ln blue" d="M419 112 H563" marker-end="url(#ah-blue)"/>
  <circle class="badge blue" cx="446" cy="112" r="12"/><text class="badge-t" x="446" y="116.500">2</text>
  <text class="t-mono mid" x="506" y="101">GET /menu</text>

  <path class="ln green" d="M565 208 H421" marker-end="url(#ah-green)"/>
  <circle class="badge green" cx="546" cy="208" r="12"/><text class="badge-t" x="546" y="212.500">3</text>
  <text class="t-mono mid" x="486" y="197">200 OK</text>
  <text class="t-xs t-b mid tc-warm" x="490" y="232">허락 헤더 없음</text>

  <rect class="panel" x="20" y="286" width="720" height="70" rx="14"/>
  <use href="#i-terminal" x="34" y="305" width="32" height="32" class="ic"/>
  <text class="t-mono" x="78" y="326">curl localhost:8000/menu</text>
  <path class="ln green" d="M292 321 H338" marker-end="url(#ah-green)"/>
  <text class="t-mono t-b tc-green" x="350" y="326">200 OK</text>
  <text class="t-s" x="424" y="326">터미널에는 출처 검사가 없다</text>
</svg>
