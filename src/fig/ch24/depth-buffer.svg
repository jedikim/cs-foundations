<svg viewBox="0 0 760 332" xmlns="http://www.w3.org/2000/svg">
  <title>깊이 버퍼는 픽셀마다 가장 가까운 거리를 기억해, 나중에 그린 바위라도 나무보다 멀면 그 칸에는 그리지 않는다</title>
  <text class="t-h" x="20" y="34">화면 픽셀 다섯 칸을 차례로 덮어 보기</text>
  <text class="t-xs end" x="726" y="34">칸 안 = 보이는 물체와 깊이 버퍼의 거리</text>

  <circle class="badge" cx="34" cy="79" r="12"/><text class="badge-t" x="34" y="83.5">1</text>
  <text class="t-b" x="56" y="75">벽을 그린다</text>
  <text class="t-s" x="56" y="95">거리 9 · 다섯 칸 모두 덮음</text>
  <rect class="box gray" x="330" y="56" width="76" height="46" rx="6"/><text class="t-b mid" x="368" y="84">벽 9</text>
  <rect class="box gray" x="410" y="56" width="76" height="46" rx="6"/><text class="t-b mid" x="448" y="84">벽 9</text>
  <rect class="box gray" x="490" y="56" width="76" height="46" rx="6"/><text class="t-b mid" x="528" y="84">벽 9</text>
  <rect class="box gray" x="570" y="56" width="76" height="46" rx="6"/><text class="t-b mid" x="608" y="84">벽 9</text>
  <rect class="box gray" x="650" y="56" width="76" height="46" rx="6"/><text class="t-b mid" x="688" y="84">벽 9</text>

  <circle class="badge green" cx="34" cy="163" r="12"/><text class="badge-t" x="34" y="167.5">2</text>
  <text class="t-b" x="56" y="159">나무를 그린다</text>
  <text class="t-s" x="56" y="179">거리 3 · 둘째, 셋째 칸을 덮으려 함</text>
  <rect class="box gray" x="330" y="140" width="76" height="46" rx="6"/><text class="t-b mid" x="368" y="168">벽 9</text>
  <rect class="box green" x="410" y="140" width="76" height="46" rx="6"/><text class="t-b mid" x="448" y="168">나무 3</text>
  <rect class="box green" x="490" y="140" width="76" height="46" rx="6"/><text class="t-b mid" x="528" y="168">나무 3</text>
  <rect class="box gray" x="570" y="140" width="76" height="46" rx="6"/><text class="t-b mid" x="608" y="168">벽 9</text>
  <rect class="box gray" x="650" y="140" width="76" height="46" rx="6"/><text class="t-b mid" x="688" y="168">벽 9</text>
  <text class="t-xs tc-green mid" x="488" y="204">3 &lt; 9 → 더 가까우니 덮어씀</text>

  <circle class="badge warm" cx="34" cy="247" r="12"/><text class="badge-t" x="34" y="251.5">3</text>
  <text class="t-b" x="56" y="243">바위를 그린다</text>
  <text class="t-s" x="56" y="263">거리 6 · 셋째~다섯째 칸을 덮으려 함</text>
  <rect class="box gray" x="330" y="224" width="76" height="46" rx="6"/><text class="t-b mid" x="368" y="252">벽 9</text>
  <rect class="box green" x="410" y="224" width="76" height="46" rx="6"/><text class="t-b mid" x="448" y="252">나무 3</text>
  <rect class="box green" x="490" y="224" width="76" height="46" rx="6"/><text class="t-b mid" x="528" y="252">나무 3</text>
  <rect class="box warm" x="570" y="224" width="76" height="46" rx="6"/><text class="t-b mid" x="608" y="252">바위 6</text>
  <rect class="box warm" x="650" y="224" width="76" height="46" rx="6"/><text class="t-b mid" x="688" y="252">바위 6</text>
  <text class="t-xs t-b tc-red mid" x="528" y="288">6 &gt; 3 → 버림</text>
  <text class="t-xs tc-warm mid" x="648" y="288">6 &lt; 9 → 덮어씀</text>

  <text class="t-s t-b" x="20" y="318">그린 순서와 상관없이, 칸마다 가장 가까운 것이 남는다</text>
</svg>
