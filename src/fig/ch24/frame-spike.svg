  <text class="t-b" x="110" y="84">평균 14ms, 약 70FPS</text>
  <text class="t-s" x="110" y="106">숫자만 보면 예산 안쪽</text>
  <text class="t-b tc-red" x="516" y="110">가비지 컬렉션이</text>
  <text class="t-b tc-red" x="516" y="132">한꺼번에 청소한 장</text>
  <text class="t-s" x="516" y="156">화면이 서너 장 동안 멈춘다</text>
  <text class="t-xs" x="96" y="314">프레임 번호 →</text>
