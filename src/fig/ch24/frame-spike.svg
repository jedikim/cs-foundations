  <text class="t-xs mid" x="277" y="294">4</text>
  <rect class="solid blue" x="310" y="246" width="34" height="30" rx="4"/>
  <text class="t-xs mid" x="327" y="294">5</text>
  <rect class="solid blue" x="360" y="249" width="34" height="27" rx="4"/>
  <text class="t-xs mid" x="377" y="294">6</text>
  <rect class="solid blue" x="410" y="243" width="34" height="33" rx="4"/>
  <text class="t-xs mid" x="427" y="294">7</text>
  <rect class="solid red" x="460" y="96" width="34" height="180" rx="4"/>
  <text class="t-xs mid" x="477" y="294">8</text>
  <text class="t-mono t-b tc-red mid" x="477" y="88">60ms</text>
  <rect class="solid blue" x="510" y="246" width="34" height="30" rx="4"/>
  <text class="t-xs mid" x="527" y="294">9</text>
  <rect class="solid blue" x="560" y="246" width="34" height="30" rx="4"/>
  <text class="t-xs mid" x="577" y="294">10</text>
  <rect class="solid blue" x="610" y="249" width="34" height="27" rx="4"/>
