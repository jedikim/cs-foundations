<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg">
  <title>프레임 대부분이 10ms 안팎이라 평균은 넉넉해 보여도, 가비지 컬렉션이 돈 한 프레임이 60ms가 되면 화면이 뚝 끊긴다</title>
  <text class="t-h" x="20" y="34">프레임 12장이 각각 걸린 시간</text>
  <path class="ln thin" d="M96 276 H716"/>
  <text class="t-xs end" x="88" y="280">0</text>
  <path class="ln thin red dash" d="M96 226 H716"/>
  <text class="t-xs tc-red end" x="88" y="230">16.7ms</text>
  <text class="t-xs end" x="88" y="106">60ms</text>
  <rect class="solid blue" x="110" y="246" width="34" height="30" rx="4"/>
  <text class="t-xs mid" x="127" y="294">1</text>
  <rect class="solid blue" x="160" y="249" width="34" height="27" rx="4"/>
  <text class="t-xs mid" x="177" y="294">2</text>
  <rect class="solid blue" x="210" y="243" width="34" height="33" rx="4"/>
