<svg viewBox="0 0 760 352" xmlns="http://www.w3.org/2000/svg">
  <title>사설망 안에서 로드 밸런서만 바깥에 열려 있고, 앱 서버와 데이터베이스는 정해진 상대의 요청만 받는다</title>

  <rect class="box purple" x="20" y="126" width="96" height="96" rx="14"/>
  <use href="#i-globe" x="48" y="138" width="40" height="40" class="ic purple"/>
  <text class="t-b mid" x="68" y="206">인터넷</text>

  <rect class="panel" x="140" y="20" width="600" height="270" rx="16"/>
  <text class="t-s t-b" x="156" y="44">사설망 (VPC)</text>
  <text class="t-xs" x="248" y="44">안에서만 통하는 주소 10.0.x.x</text>

  <rect class="panel warm" x="156" y="58" width="180" height="216" rx="12"/>
  <text class="t-s t-b" x="170" y="82">공개 서브넷</text>
  <text class="t-xs" x="170" y="100">바깥에서 들어올 수 있다</text>
  <rect class="box" x="172" y="126" width="148" height="96" rx="12"/>
  <use href="#i-scale" x="228" y="132" width="36" height="36" class="ic warm"/>
  <text class="t-b mid" x="246" y="188">로드 밸런서</text>
  <text class="t-mono mid" x="246" y="210">:443 ← 누구나</text>

  <rect class="panel green" x="356" y="58" width="368" height="216" rx="12"/>
  <text class="t-s t-b" x="370" y="82">비공개 서브넷</text>
  <text class="t-xs" x="370" y="100">바깥에서 곧장 들어올 수 없다</text>

  <rect class="box blue" x="372" y="116" width="180" height="60" rx="12"/>
  <use href="#i-server" x="380" y="132" width="28" height="28" class="ic blue"/>
  <text class="t-b" x="416" y="141">앱 서버 1</text>
  <text class="t-mono" x="416" y="163">:8080 ← 밸런서만</text>

  <rect class="box blue" x="372" y="196" width="180" height="60" rx="12"/>
  <use href="#i-server" x="380" y="212" width="28" height="28" class="ic blue"/>
  <text class="t-b" x="416" y="221">앱 서버 2</text>
  <text class="t-mono" x="416" y="243">:8080 ← 밸런서만</text>

  <rect class="box" x="600" y="128" width="116" height="116" rx="12"/>
  <use href="#i-db" x="640" y="138" width="36" height="36" class="ic green"/>
  <text class="t-b mid" x="658" y="198">데이터베이스</text>
  <text class="t-mono mid" x="658" y="222">:5432 ← 앱만</text>

  <path class="ln green" d="M120 174 H166" marker-end="url(#ah-green)"/>
  <path class="ln blue" d="M324 162 L366 150" marker-end="url(#ah-blue)"/>
  <path class="ln blue" d="M324 188 L366 220" marker-end="url(#ah-blue)"/>
  <path class="ln green" d="M556 152 L594 170" marker-end="url(#ah-green)"/>
  <path class="ln green" d="M556 220 L594 202" marker-end="url(#ah-green)"/>

  <path class="ln red dash" d="M68 228 V318 H658 V306"/>
  <use href="#i-stop" x="644" y="276" width="28" height="28" class="ic red"/>
  <text class="t-s t-b tc-red mid" x="363" y="340">인터넷에서 DB로 곧장 가는 길은 없다</text>
</svg>
