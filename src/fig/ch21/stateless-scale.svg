<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg">
  <title>로그인 기록을 서버 메모리에 두면 다른 서버는 모르고, 바깥 저장소에 두면 어느 서버로 가도 된다</title>

  <rect class="panel" x="20" y="20" width="350" height="300" rx="16"/>
  <text class="t-l" x="36" y="50">서버 메모리에 두면</text>
  <rect class="box warm" x="125" y="66" width="140" height="36" rx="10"/>
  <text class="t-b mid" x="195" y="89">로드 밸런서</text>

  <path class="ln blue" d="M170 106 L120 144" marker-end="url(#ah-blue)"/>
  <text class="t-xs mid" x="92" y="126">① 로그인</text>
  <path class="ln blue" d="M220 106 L270 144" marker-end="url(#ah-blue)"/>
  <text class="t-xs mid" x="302" y="126">② 내 사진 보기</text>

  <rect class="box blue" x="36" y="150" width="152" height="96" rx="12"/>
  <text class="t-b" x="48" y="174">서버 1</text>
  <rect class="box green" x="48" y="184" width="128" height="26" rx="6"/>
  <text class="t-s t-ink mid" x="112" y="202">민지: 로그인됨</text>
  <text class="t-mono tc-green" x="48" y="234">200 OK</text>

  <rect class="box blue" x="202" y="150" width="152" height="96" rx="12"/>
  <text class="t-b" x="214" y="174">서버 2</text>
  <rect class="ghost dash" x="214" y="184" width="128" height="26" rx="6"/>
  <text class="t-s mid" x="278" y="202">기록 없음</text>
  <text class="t-mono tc-red" x="214" y="234">401 누구세요?</text>

  <text class="t-s" x="36" y="276">두 번째 요청이 서버 2로 가면</text>
  <text class="t-s" x="36" y="296">로그인이 풀린 것처럼 보인다</text>

  <rect class="panel" x="390" y="20" width="350" height="300" rx="16"/>
  <text class="t-l" x="406" y="50">바깥 저장소에 두면</text>
  <rect class="box warm" x="495" y="66" width="140" height="36" rx="10"/>
  <text class="t-b mid" x="565" y="89">로드 밸런서</text>

  <path class="ln blue" d="M540 106 L490 144" marker-end="url(#ah-blue)"/>
  <text class="t-xs mid" x="462" y="126">① 로그인</text>
  <path class="ln blue" d="M590 106 L640 144" marker-end="url(#ah-blue)"/>
  <text class="t-xs mid" x="672" y="126">② 내 사진 보기</text>

  <rect class="box blue" x="406" y="150" width="152" height="60" rx="12"/>
  <text class="t-b" x="418" y="174">서버 1</text>
  <text class="t-mono tc-green" x="418" y="198">200 OK</text>

  <rect class="box blue" x="572" y="150" width="152" height="60" rx="12"/>
  <text class="t-b" x="584" y="174">서버 2</text>
  <text class="t-mono tc-green" x="584" y="198">200 OK</text>

  <path class="ln green" d="M482 214 L516 244" marker-end="url(#ah-green)"/>
  <path class="ln green" d="M648 214 L614 244" marker-end="url(#ah-green)"/>

  <rect class="box green" x="466" y="250" width="198" height="54" rx="12"/>
  <use href="#i-db" x="476" y="261" width="32" height="32" class="ic green"/>
  <text class="t-b" x="518" y="273">세션 저장소</text>
  <text class="t-s" x="518" y="293">민지: 로그인됨</text>
</svg>
