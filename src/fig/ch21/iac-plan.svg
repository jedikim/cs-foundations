<svg viewBox="0 0 760 392" xmlns="http://www.w3.org/2000/svg">
  <title>plan은 선언 파일, 상태 파일, 실제 자원을 비교해 무엇을 만들고 지울지 적용 전에 보여 준다</title>

  <rect class="box blue" x="20" y="20" width="226" height="166" rx="14"/>
  <text class="t-l" x="36" y="48">선언 파일</text>
  <text class="t-s" x="36" y="68">내가 고친 것 (원하는 상태)</text>
  <text class="t-mono tc-red" x="36" y="100">- 서버 = 2</text>
  <text class="t-mono tc-green" x="36" y="122">+ 서버 = 3</text>
  <text class="t-mono tc-red" x="36" y="150">- DB 암호화 = 끔</text>
  <text class="t-mono tc-green" x="36" y="172">+ DB 암호화 = 켬</text>

  <rect class="box" x="267" y="20" width="226" height="166" rx="14"/>
  <text class="t-l" x="283" y="48">상태 파일</text>
  <text class="t-s" x="283" y="68">도구의 장부 (이름과 실제 ID)</text>
  <text class="t-mono" x="283" y="104">서버[0]</text>
  <text class="t-mono" x="352" y="104">→ srv-a1</text>
  <text class="t-mono" x="283" y="132">서버[1]</text>
  <text class="t-mono" x="352" y="132">→ srv-b2</text>
  <text class="t-mono" x="283" y="160">DB</text>
  <text class="t-mono" x="352" y="160">→ db-9f</text>

  <rect class="box green" x="514" y="20" width="226" height="166" rx="14"/>
  <text class="t-l" x="530" y="48">실제 자원</text>
  <text class="t-s" x="530" y="68">지금 클라우드에 있는 것</text>
  <use href="#i-server" x="530" y="85" width="26" height="26" class="ic green"/>
  <text class="t-mono" x="566" y="104">srv-a1</text>
  <use href="#i-server" x="530" y="113" width="26" height="26" class="ic green"/>
  <text class="t-mono" x="566" y="132">srv-b2</text>
  <use href="#i-db" x="530" y="141" width="26" height="26" class="ic green"/>
  <text class="t-mono" x="566" y="160">db-9f</text>

  <path class="ln muted" d="M133 190 V206 H627 V190"/>
  <path class="ln muted" d="M380 190 V228" marker-end="url(#ah-muted)"/>
  <text class="t-s t-b" x="394" y="224">plan: 셋을 비교해 미리 보기</text>

  <rect class="box" x="20" y="236" width="720" height="138" rx="14"/>
  <text class="t-mono t-b tc-green" x="36" y="264">+ 서버[2]</text>
  <text class="t-s" x="150" y="264">서버 한 대를 새로 만든다</text>
  <text class="t-mono t-b tc-red" x="36" y="290">-/+ DB</text>
  <text class="t-s t-b tc-red" x="150" y="290">DB를 지우고 새로 만든다. 안의 데이터는 따라오지 않는다</text>
  <path class="ln thin muted" d="M36 304 H724"/>
  <text class="t-mono t-b" x="36" y="328">Plan: 2 to add, 0 to change, 1 to destroy.</text>
  <text class="t-xs" x="36" y="354">고친 곳은 두 군데뿐인데 하나는 DB 교체입니다. 적용(apply)하기 전에 반드시 읽습니다.</text>
</svg>
