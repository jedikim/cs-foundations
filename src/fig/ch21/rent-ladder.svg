<svg viewBox="0 0 760 392" xmlns="http://www.w3.org/2000/svg">
  <title>빌리는 방식이 가상 머신, 컨테이너, 서버리스, 관리형 서비스로 갈수록 내가 관리하는 층이 줄어든다</title>

