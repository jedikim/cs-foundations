<svg viewBox="0 0 760 226" xmlns="http://www.w3.org/2000/svg">
  <title>AI와 만들 때 사람이 하는 세 가지: 시키기, 확인하기, 그리고 안 될 때 고장 난 곳을 좁혀서 다시 시키기</title>

  <rect class="box blue" x="20" y="24" width="150" height="70" rx="12"/>
  <text class="t-l mid" x="95" y="54">시키기</text>
  <text class="t-s mid" x="95" y="76">무엇을 만들지 말한다</text>

  <rect class="box gray" x="220" y="24" width="130" height="70" rx="12"/>
  <text class="t-l mid" x="285" y="54">AI가 만든다</text>
  <text class="t-s mid" x="285" y="76">코드를 쓴다</text>

  <rect class="box blue" x="400" y="24" width="150" height="70" rx="12"/>
  <text class="t-l mid" x="475" y="54">확인하기</text>
  <text class="t-s mid" x="475" y="76">돌려 보고 읽어 본다</text>

  <rect class="box green" x="610" y="24" width="130" height="70" rx="12"/>
  <text class="t-l mid" x="675" y="54">완성</text>
  <text class="t-s mid" x="675" y="76">다음 일로</text>

  <path class="ln" d="M173 59 H215" marker-end="url(#ah)"/>
  <path class="ln" d="M353 59 H395" marker-end="url(#ah)"/>
  <path class="ln green" d="M553 59 H605" marker-end="url(#ah-green)"/>
  <text class="t-xs t-b tc-green mid" x="579" y="48">잘 되면</text>

  <path class="ln warm" d="M475 97 V135" marker-end="url(#ah-warm)"/>
  <text class="t-xs t-b tc-warm" x="487" y="120">안 되면</text>

  <rect class="box warm" x="400" y="140" width="150" height="70" rx="12"/>
  <text class="t-l mid" x="475" y="170">좁히기</text>
  <text class="t-s mid" x="475" y="192">고장 난 곳을 찾는다</text>

  <path class="ln warm" d="M397 175 H95 V100" marker-end="url(#ah-warm)"/>
  <text class="t-s mid" x="246" y="166">좁혀서 다시 시킨다</text>
</svg>
