<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg">
  <title>Seq2Seq는 메모 한 장만 넘겨받아 번역하고, 어텐션은 단어를 쓸 때마다 원문 전체를 비중을 달리해 다시 본다</title>

  <text class="t-b" x="20" y="34">Seq2Seq: 다 읽고, 메모 한 장만 넘긴다</text>

  <rect class="box blue" x="20" y="56" width="50" height="40" rx="9"/>
  <text class="mid" x="45" y="81">I</text>
  <rect class="box blue" x="76" y="56" width="60" height="40" rx="9"/>
  <text class="mid" x="106" y="81">like</text>
  <rect class="box blue" x="142" y="56" width="56" height="40" rx="9"/>
  <text class="mid" x="170" y="81">tea</text>
  <text class="t-s" x="20" y="118">읽는 쪽 (인코더)</text>

  <path class="ln" d="M206 76 H266" marker-end="url(#ah)"/>

  <rect class="box yellow" x="276" y="48" width="208" height="56" rx="12"/>
  <rect class="box" x="286" y="59" width="44" height="34" rx="7"/>
  <text class="t-mono mid" x="308" y="81">0.3</text>
  <rect class="box" x="334" y="59" width="44" height="34" rx="7"/>
  <text class="t-mono mid" x="356" y="81">−1.2</text>
  <rect class="box" x="382" y="59" width="44" height="34" rx="7"/>
  <text class="t-mono mid" x="404" y="81">0.8</text>
  <rect class="box" x="430" y="59" width="44" height="34" rx="7"/>
  <text class="t-mono mid" x="452" y="81">0.1</text>
  <text class="t-s mid" x="380" y="124">크기가 정해진 메모</text>
  <text class="t-s t-b tc-warm mid" x="380" y="144">문장이 길어져도 칸 수는 그대로</text>

  <path class="ln" d="M492 76 H520" marker-end="url(#ah)"/>

  <rect class="box green" x="530" y="56" width="46" height="40" rx="9"/>
  <text class="mid" x="553" y="81">나는</text>
  <rect class="box green" x="580" y="56" width="46" height="40" rx="9"/>
  <text class="mid" x="603" y="81">차를</text>
  <rect class="box green" x="630" y="56" width="70" height="40" rx="9"/>
  <text class="mid" x="665" y="81">좋아한다</text>
  <rect class="box gray" x="704" y="56" width="36" height="40" rx="9"/>
  <text class="mid" x="722" y="81">끝</text>
  <text class="t-s" x="530" y="118">쓰는 쪽 (디코더)</text>

  <path class="ln thin muted" d="M20 170 H740"/>

  <text class="t-b" x="20" y="204">어텐션: 단어를 쓸 때마다 원문을 다시 본다</text>

  <text class="t-s" x="20" y="275">원문 (자리마다 메모)</text>
  <text class="t-mono mid tc-muted" x="285" y="236">0.05</text>
  <text class="t-mono mid tc-muted" x="385" y="236">0.15</text>
  <text class="t-mono t-b mid tc-green" x="485" y="236">0.80</text>
  <text class="t-s" x="540" y="236">이번에 볼 비중 (합은 1)</text>

  <rect class="box blue" x="250" y="250" width="70" height="40" rx="9"/>
  <text class="mid" x="285" y="275">I</text>
  <rect class="box blue" x="350" y="250" width="70" height="40" rx="9"/>
  <text class="mid" x="385" y="275">like</text>
  <rect class="box blue" x="450" y="250" width="70" height="40" rx="9"/>
  <text class="mid" x="485" y="275">tea</text>

  <path class="ln thin muted" d="M370 350 L295 296"/>
  <path class="ln thin muted" d="M385 350 V296"/>
  <path class="ln thick green" d="M402 350 L474 298" marker-end="url(#ah-green)"/>

  <text class="t-s" x="20" y="381">번역문 (지금 쓰는 중)</text>
  <rect class="box gray" x="250" y="356" width="70" height="40" rx="9"/>
  <text class="mid tc-muted" x="285" y="381">나는</text>
  <rect class="solid green" x="350" y="356" width="70" height="40" rx="9"/>
  <text class="t-on t-b mid" x="385" y="381">차를</text>
  <rect class="ghost dash" x="450" y="356" width="70" height="40" rx="9"/>
  <text class="mid tc-muted" x="485" y="381">?</text>
  <text class="t-s" x="540" y="381">다음 단어에서는 비중이 바뀐다</text>
</svg>
