<svg viewBox="0 0 760 356" xmlns="http://www.w3.org/2000/svg">
  <title>사진 세 장과 문장 세 개의 유사도 표에서 맞는 짝인 대각선만 높아지도록 학습한다</title>

  <text class="t-s t-b end" x="210" y="50">문장 →</text>
  <text class="t-s t-b" x="70" y="76">사진 ↓</text>

  <rect class="box purple" x="250" y="24" width="140" height="42" rx="10"/>
  <text class="t-b mid" x="320" y="50">"자동차 사진"</text>
  <rect class="box purple" x="400" y="24" width="140" height="42" rx="10"/>
  <text class="t-b mid" x="470" y="50">"집 사진"</text>
  <rect class="box purple" x="550" y="24" width="140" height="42" rx="10"/>
  <text class="t-b mid" x="620" y="50">"책 사진"</text>

  <rect class="box blue" x="70" y="88" width="140" height="64" rx="10"/>
  <use href="#i-car" x="118" y="98" width="44" height="44" class="ic blue"/>
  <rect class="box blue" x="70" y="164" width="140" height="64" rx="10"/>
  <use href="#i-house" x="118" y="174" width="44" height="44" class="ic blue"/>
  <rect class="box blue" x="70" y="240" width="140" height="64" rx="10"/>
  <use href="#i-book" x="118" y="250" width="44" height="44" class="ic blue"/>

  <rect class="solid green" x="250" y="88" width="140" height="64" rx="10"/>
  <text class="t-l t-on mid" x="320" y="126">0.9</text>
  <rect class="box gray" x="400" y="88" width="140" height="64" rx="10"/>
  <text class="t-mono mid tc-muted" x="470" y="125">0.1</text>
  <rect class="box gray" x="550" y="88" width="140" height="64" rx="10"/>
  <text class="t-mono mid tc-muted" x="620" y="125">0.1</text>

  <rect class="box gray" x="250" y="164" width="140" height="64" rx="10"/>
  <text class="t-mono mid tc-muted" x="320" y="201">0.2</text>
  <rect class="solid green" x="400" y="164" width="140" height="64" rx="10"/>
  <text class="t-l t-on mid" x="470" y="202">0.8</text>
  <rect class="box gray" x="550" y="164" width="140" height="64" rx="10"/>
  <text class="t-mono mid tc-muted" x="620" y="201">0.1</text>

  <rect class="box gray" x="250" y="240" width="140" height="64" rx="10"/>
  <text class="t-mono mid tc-muted" x="320" y="277">0.1</text>
  <rect class="box gray" x="400" y="240" width="140" height="64" rx="10"/>
  <text class="t-mono mid tc-muted" x="470" y="277">0.2</text>
  <rect class="solid green" x="550" y="240" width="140" height="64" rx="10"/>
  <text class="t-l t-on mid" x="620" y="278">0.9</text>

  <rect class="solid green" x="250" y="324" width="18" height="18" rx="5"/>
  <text class="t-s" x="276" y="338">맞는 짝: 점수를 높인다</text>
  <rect class="box gray" x="460" y="324" width="18" height="18" rx="5"/>
  <text class="t-s" x="486" y="338">틀린 짝: 점수를 낮춘다</text>
</svg>
