<svg viewBox="0 0 760 402" xmlns="http://www.w3.org/2000/svg">
  <title>같은 비밀번호 apple123을 그대로 저장한 경우, 해시만 한 경우, 솔트를 넣어 느리게 해시한 경우 DB에 남는 값을 비교한다</title>
  <text class="t-s t-b" x="36" y="32">저장하는 방법</text>
  <text class="t-s t-b" x="236" y="32">DB에 들어 있는 값 (둘 다 apple123)</text>
  <text class="t-s t-b" x="554" y="32">DB를 도둑맞으면</text>

  <rect class="box red" x="20" y="46" width="720" height="104" rx="12"/>
  <circle class="badge red" cx="46" cy="80" r="12"/><text class="badge-t" x="46" y="84.500">1</text>
  <text class="t-b" x="66" y="85">그대로 저장</text>
  <text class="t-s" x="36" y="112">평문이라고 부른다</text>
  <rect class="box" x="236" y="60" width="300" height="76" rx="8"/>
  <path class="ln thin muted" d="M236 98 H536"/>
  <text x="250" y="85">민지</text>
  <text class="t-mono t-b tc-red" x="300" y="85">apple123</text>
  <text x="250" y="123">준호</text>
  <text class="t-mono t-b tc-red" x="300" y="123">apple123</text>
  <text class="t-s tc-red" x="554" y="92">읽자마자 그대로</text>
  <text class="t-s tc-red" x="554" y="112">로그인할 수 있다</text>

  <rect class="box warm" x="20" y="162" width="720" height="104" rx="12"/>
  <circle class="badge warm" cx="46" cy="196" r="12"/><text class="badge-t" x="46" y="200.500">2</text>
  <text class="t-b" x="66" y="201">해시만 한다</text>
  <text class="t-s" x="36" y="228">빠른 해시 한 번</text>
  <rect class="box" x="236" y="176" width="300" height="76" rx="8"/>
  <path class="ln thin muted" d="M236 214 H536"/>
  <text x="250" y="201">민지</text>
  <text class="t-mono" x="300" y="201">599a4410e2af…</text>
  <text x="250" y="239">준호</text>
  <text class="t-mono" x="300" y="239">599a4410e2af…</text>
  <text class="t-s tc-warm" x="554" y="208">같은 비밀번호는 같은 값.</text>
  <text class="t-s tc-warm" x="554" y="228">흔한 것부터 금방 맞힌다</text>

  <rect class="box green" x="20" y="278" width="720" height="104" rx="12"/>
  <circle class="badge green" cx="46" cy="312" r="12"/><text class="badge-t" x="46" y="316.500">3</text>
  <text class="t-b" x="66" y="317">솔트 + 느린 해시</text>
  <text class="t-s" x="36" y="344">Argon2id, bcrypt 등</text>
  <rect class="box" x="236" y="292" width="300" height="76" rx="8"/>
  <path class="ln thin muted" d="M236 330 H536"/>
  <text x="250" y="317">민지</text>
  <text class="t-mono" x="300" y="317"><tspan class="t-b tc-green">x7Qp</tspan> + 9f2c04be71d3…</text>
  <text x="250" y="355">준호</text>
  <text class="t-mono" x="300" y="355"><tspan class="t-b tc-green">Lm3z</tspan> + 41d7e9a05c88…</text>
  <text class="t-s tc-green" x="554" y="324">값이 모두 다르다.</text>
  <text class="t-s tc-green" x="554" y="344">하나씩 오래 계산해야 한다</text>
</svg>
