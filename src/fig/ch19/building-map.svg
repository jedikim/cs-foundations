<svg viewBox="0 0 760 376" xmlns="http://www.w3.org/2000/svg">
  <title>건물 로비의 신분 확인은 인증, 출입증은 세션, 층마다 있는 문의 확인은 인가에 대응한다</title>
  <text class="t-s t-b" x="22" y="104">건물에서는</text>
  <text class="t-s t-b" x="22" y="288">서비스에서는</text>

  <rect class="box yellow" x="112" y="30" width="190" height="140" rx="14"/>
  <use href="#i-idcard" x="183" y="40" width="48" height="48" class="ic yellow"/>
  <text class="t-l mid" x="207" y="112">로비 안내데스크</text>
  <text class="t-s mid" x="207" y="134">신분증으로 누구인지 확인</text>
  <text class="t-xs mid" x="207" y="155">“김민지 님 맞으시네요”</text>

  <rect class="box yellow" x="332" y="30" width="190" height="140" rx="14"/>
  <use href="#i-ticket" x="403" y="40" width="48" height="48" class="ic yellow"/>
  <text class="t-l mid" x="427" y="112">출입증</text>
  <text class="t-s mid" x="427" y="134">한 번 확인하면 내어 준다</text>
  <text class="t-xs mid" x="427" y="155">방문증 A-17</text>

  <rect class="box yellow" x="552" y="30" width="190" height="140" rx="14"/>
  <use href="#i-door" x="623" y="40" width="48" height="48" class="ic yellow"/>
  <text class="t-l mid" x="647" y="112">층마다 있는 문</text>
  <text class="t-s mid" x="647" y="134">허락된 층만 열린다</text>
  <text class="t-xs mid" x="647" y="155">방문증으로 3층은 안 열림</text>

  <path class="ln muted" d="M207 176 V208" marker-end="url(#ah-muted)"/>
  <path class="ln muted" d="M427 176 V208" marker-end="url(#ah-muted)"/>
  <path class="ln muted" d="M647 176 V208" marker-end="url(#ah-muted)"/>

  <rect class="box blue" x="112" y="214" width="190" height="140" rx="14"/>
  <use href="#i-user" x="183" y="224" width="48" height="48" class="ic blue"/>
  <text class="t-l mid" x="207" y="296">인증</text>
  <text class="t-s mid" x="207" y="318">누구인지 확인한다</text>
  <text class="t-mono mid" x="207" y="340">POST /login</text>

  <rect class="box green" x="332" y="214" width="190" height="140" rx="14"/>
  <use href="#i-key" x="403" y="224" width="48" height="48" class="ic green"/>
  <text class="t-l mid" x="427" y="296">세션</text>
  <text class="t-s mid" x="427" y="318">로그인 상태를 이어 준다</text>
  <text class="t-mono mid" x="427" y="340">sid=8f3a2c</text>

  <rect class="box warm" x="552" y="214" width="190" height="140" rx="14"/>
  <use href="#i-shield" x="623" y="224" width="48" height="48" class="ic warm"/>
  <text class="t-l mid" x="647" y="296">인가</text>
  <text class="t-s mid" x="647" y="318">해도 되는 일인지 확인</text>
  <text class="t-mono mid" x="647" y="340">GET /admin → 403</text>
</svg>
