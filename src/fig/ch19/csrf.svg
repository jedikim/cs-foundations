<svg viewBox="0 0 760 384" xmlns="http://www.w3.org/2000/svg">
  <title>다른 사이트가 시킨 요청에도 브라우저가 로그인 쿠키를 자동으로 붙이면, 서버는 본인이 보낸 요청으로 착각한다</title>

  <rect class="panel" x="20" y="20" width="340" height="238" rx="14"/>
  <text class="t-b" x="36" y="46">민지의 브라우저</text>

  <rect class="box green" x="36" y="58" width="308" height="84" rx="10"/>
  <use href="#i-browser" x="48" y="82" width="36" height="36" class="ic green"/>
  <text class="t-b" x="98" y="84">탭 1: shop.example</text>
  <text class="t-xs" x="98" y="105">로그인한 상태</text>
  <text class="t-mono" x="98" y="128">쿠키 sid=8f3a2c</text>

  <rect class="box red" x="36" y="156" width="308" height="88" rx="10"/>
  <use href="#i-warn" x="48" y="182" width="36" height="36" class="ic red"/>
  <text class="t-b" x="98" y="183">탭 2: 쿠폰 낚시 페이지</text>
  <text class="t-xs" x="98" y="205">“쿠폰 받기”를 누르면 숨겨 둔</text>
  <text class="t-xs" x="98" y="225">양식이 shop으로 전송된다</text>

  <path class="ln red" d="M350 200 H550" marker-end="url(#ah-red)"/>
  <text class="t-mono t-b mid" x="452" y="186">POST /address</text>
  <rect class="box yellow" x="398" y="212" width="108" height="28" rx="6"/>
  <text class="t-mono mid" x="452" y="231">sid=8f3a2c</text>
  <text class="t-xs tc-red mid" x="460" y="258">브라우저가 쿠키를 알아서 붙인다</text>

  <rect class="box" x="560" y="58" width="180" height="186" rx="12"/>
  <use href="#i-server" x="630" y="70" width="40" height="40" class="ic green"/>
  <text class="t-l mid" x="650" y="136">shop 서버</text>
  <text class="t-s mid" x="650" y="164">쿠키가 맞으니</text>
  <text class="t-s mid" x="650" y="184">민지가 보낸 요청이군</text>
  <text class="t-b mid tc-red" x="650" y="218">배송지가 바뀐다</text>

  <rect class="panel green" x="20" y="276" width="720" height="92" rx="14"/>
  <text class="t-b tc-green" x="36" y="302">막는 법</text>
  <circle class="badge green" cx="124" cy="297" r="11"/><text class="badge-t" x="124" y="301.500">1</text>
  <text class="t-mono t-b" x="144" y="302">SameSite=Lax</text>
  <text class="t-xs" x="112" y="326">다른 사이트가 시킨 POST에는</text>
  <text class="t-xs" x="112" y="346">쿠키를 붙이지 않는다</text>
  <circle class="badge green" cx="434" cy="297" r="11"/><text class="badge-t" x="434" y="301.500">2</text>
  <text class="t-b" x="454" y="302">CSRF 토큰</text>
  <text class="t-xs" x="422" y="326">내 화면에만 심어 둔 값이 요청에</text>
  <text class="t-xs" x="422" y="346">함께 오지 않으면 거부한다</text>
</svg>
