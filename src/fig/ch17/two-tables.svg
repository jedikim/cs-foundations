  <text class="t-mono t-b mid" x="520" y="108">1</text>
  <rect class="box" x="570" y="88" width="80" height="30"/>
  <text class="mid" x="610" y="108">키보드</text>
  <rect class="box" x="650" y="88" width="90" height="30"/>
  <text class="t-mono mid" x="695" y="108">45000</text>
  <rect class="box blue" x="400" y="118" width="70" height="30"/>
  <text class="t-mono t-b mid" x="435" y="138">102</text>
  <rect class="box warm" x="470" y="118" width="100" height="30"/>
  <text class="t-mono t-b mid" x="520" y="138">2</text>
  <rect class="box" x="570" y="118" width="80" height="30"/>
  <text class="mid" x="610" y="138">마우스</text>
  <rect class="box" x="650" y="118" width="90" height="30"/>
  <text class="t-mono mid" x="695" y="138">18000</text>
  <rect class="box blue" x="400" y="148" width="70" height="30"/>
  <text class="t-mono t-b mid" x="435" y="168">103</text>
  <rect class="box warm" x="470" y="148" width="100" height="30"/>
  <text class="t-mono t-b mid" x="520" y="168">1</text>
  <rect class="box" x="570" y="148" width="80" height="30"/>
  <text class="mid" x="610" y="168">충전기</text>
  <rect class="box" x="650" y="148" width="90" height="30"/>
  <text class="t-mono mid" x="695" y="168">12000</text>
  <rect class="box blue" x="400" y="178" width="70" height="30"/>
  <text class="t-mono t-b mid" x="435" y="198">104</text>
  <rect class="box warm" x="470" y="178" width="100" height="30"/>
  <text class="t-mono t-b mid" x="520" y="198">1</text>
  <rect class="box" x="570" y="178" width="80" height="30"/>
  <text class="mid" x="610" y="198">케이블</text>
  <rect class="box" x="650" y="178" width="90" height="30"/>
  <text class="t-mono mid" x="695" y="198">5000</text>

  <path class="ln dash" d="M17 86 H323 V120 H17 Z"/>
  <text class="t-s" x="331" y="108">행: 한 명</text>

  <path class="ln warm" d="M520 214 V240 H50 V186" marker-end="url(#ah-warm)"/>
  <text class="t-s mid" x="285" y="262">주문 표의 member_id 칸에는 회원 표의 id를 적는다</text>

  <rect class="box red" x="20" y="292" width="720" height="42" rx="10"/>
  <use href="#i-cross" x="32" y="299" width="28" height="28" class="ic red"/>
  <text class="t-mono" x="70" y="318">member_id = 9</text>
  <text x="187" y="318">인 주문 추가</text>
  <path class="ln red" d="M292 313 H322" marker-end="url(#ah-red)"/>
  <text class="t-b tc-red" x="336" y="318">거절</text>
  <text class="t-s" x="378" y="318">회원 표에 9번이 없다</text>
</svg>
