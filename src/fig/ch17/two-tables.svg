<svg viewBox="0 0 760 350" xmlns="http://www.w3.org/2000/svg">
  <title>회원 표와 주문 표. 기본 키 id가 행을 구분하고, 주문 표의 외래 키 member_id가 회원 표의 id를 가리킨다</title>
  <text class="t-l" x="20" y="26">회원 표 members</text>
  <text class="t-l" x="400" y="26">주문 표 orders</text>

  <text class="t-s t-b mid tc-blue" x="50" y="46">기본 키</text>
