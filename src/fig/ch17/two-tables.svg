  <path class="ln thin" d="M184 54 V50 H316 V54"/>
  <text class="t-s t-b mid tc-blue" x="435" y="46">기본 키</text>
  <text class="t-s t-b mid tc-warm" x="520" y="46">외래 키</text>

  <rect class="box blue" x="20" y="58" width="60" height="30"/>
