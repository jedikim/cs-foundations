  <rect class="box" x="180" y="88" width="140" height="30"/>
  <text class="t-mono mid" x="250" y="108">010-1111-2222</text>
  <rect class="box blue" x="20" y="118" width="60" height="30"/>
  <text class="t-mono t-b mid" x="50" y="138">2</text>
  <rect class="box" x="80" y="118" width="100" height="30"/>
  <text class="mid" x="130" y="138">이준호</text>
  <rect class="box" x="180" y="118" width="140" height="30"/>
  <text class="t-mono mid" x="250" y="138">010-3333-4444</text>
  <rect class="box blue" x="20" y="148" width="60" height="30"/>
  <text class="t-mono t-b mid" x="50" y="168">3</text>
  <rect class="box" x="80" y="148" width="100" height="30"/>
  <text class="mid" x="130" y="168">박서연</text>
  <rect class="box" x="180" y="148" width="140" height="30"/>
  <text class="t-mono mid tc-muted" x="250" y="168">NULL</text>

  <rect class="box blue" x="400" y="58" width="70" height="30"/>
  <text class="t-mono t-b mid" x="435" y="78">id</text>
  <rect class="box warm" x="470" y="58" width="100" height="30"/>
  <text class="t-mono t-b mid" x="520" y="78">member_id</text>
  <rect class="box gray" x="570" y="58" width="80" height="30"/>
  <text class="t-mono t-b mid" x="610" y="78">item</text>
  <rect class="box gray" x="650" y="58" width="90" height="30"/>
