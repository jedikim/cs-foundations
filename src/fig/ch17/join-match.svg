  <rect class="box warm" x="190" y="142" width="110" height="30"/>
  <text class="t-mono t-b mid" x="245" y="162">2</text>
  <rect class="box" x="40" y="172" width="60" height="30"/>
  <text class="t-mono mid" x="70" y="192">103</text>
  <rect class="box" x="100" y="172" width="90" height="30"/>
  <text class="mid" x="145" y="192">충전기</text>
  <rect class="box warm" x="190" y="172" width="110" height="30"/>
  <text class="t-mono t-b mid" x="245" y="192">1</text>
  <rect class="box" x="40" y="202" width="60" height="30"/>
