  <path class="ln warm" d="M304 127 H492" marker-end="url(#ah-warm)"/>
  <path class="ln warm" d="M304 157 H492" marker-end="url(#ah-warm)"/>
  <path class="ln warm" d="M304 187 C400 187 400 127 492 127" marker-end="url(#ah-warm)"/>
  <path class="ln warm" d="M304 217 C430 217 410 127 492 127" marker-end="url(#ah-warm)"/>
