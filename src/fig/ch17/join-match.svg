  <rect class="box warm" x="190" y="202" width="110" height="30"/>
  <text class="t-mono t-b mid" x="245" y="222">1</text>

  <rect class="box blue" x="500" y="82" width="70" height="30"/>
  <text class="t-mono t-b mid" x="535" y="102">id</text>
  <rect class="box gray" x="570" y="82" width="110" height="30"/>
  <text class="t-mono t-b mid" x="625" y="102">name</text>
  <rect class="box blue" x="500" y="112" width="70" height="30"/>
  <text class="t-mono t-b mid" x="535" y="132">1</text>
  <rect class="box" x="570" y="112" width="110" height="30"/>
  <text class="mid" x="625" y="132">김민지</text>
