<svg viewBox="0 0 760 468" xmlns="http://www.w3.org/2000/svg">
  <title>JOIN은 주문 표의 member_id와 회원 표의 id가 같은 행끼리 맞붙여 한 줄로 만든다</title>
  <text class="t-mono" x="40" y="26">SELECT orders.item, members.name</text>
  <text class="t-mono" x="40" y="48">FROM orders JOIN members ON members.id = orders.member_id</text>

  <text class="t-s t-b" x="40" y="74">orders</text>
  <text class="t-s t-b" x="500" y="74">members</text>

