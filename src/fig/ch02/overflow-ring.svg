<svg viewBox="0 0 760 345" xmlns="http://www.w3.org/2000/svg">
  <title>정해진 칸이 꽉 찬 정수는 시계처럼 처음으로 돌아간다</title>
  <text class="t-b mid" x="200" y="30">8비트 숫자 칸: 255 다음은 0</text>
