  <text class="t-mono mid" x="200" y="103">0</text>
  <circle class="box" cx="246" cy="110.3" r="18"/>
  <text class="t-mono mid" x="246" y="115.3">1</text>
  <circle class="box" cx="279.7" cy="144" r="18"/>
  <text class="t-mono mid" x="279.7" y="149">2</text>
  <circle class="box" cx="292" cy="190" r="18"/>
  <text class="t-mono mid" x="292" y="195">3</text>
  <circle class="s-surface" cx="279.7" cy="236" r="14"/>
  <text class="t-b mid tc-muted" x="279.7" y="239">…</text>
  <circle class="box" cx="246" cy="269.7" r="18"/>
  <text class="t-mono mid" x="246" y="274.7">127</text>
  <circle class="box" cx="200" cy="282" r="18"/>
  <text class="t-mono mid" x="200" y="287">128</text>
  <circle class="box" cx="154" cy="269.7" r="18"/>
  <text class="t-mono mid" x="154" y="274.7">129</text>
  <circle class="s-surface" cx="120.3" cy="236" r="14"/>
  <text class="t-b mid tc-muted" x="120.3" y="239">…</text>
  <circle class="box" cx="108" cy="190" r="18"/>
  <text class="t-mono mid" x="108" y="195">253</text>
  <circle class="box" cx="120.3" cy="144" r="18"/>
  <text class="t-mono mid" x="120.3" y="149">254</text>
  <circle class="box red" cx="154" cy="110.3" r="18"/>
  <text class="t-mono mid" x="154" y="115.3">255</text>
  <path class="ln red" d="M133.6 87.7 A122 122 0 0 1 189.4 68.5" marker-end="url(#ah-red)"/>
  <text class="t-b mid tc-red" x="147.6" y="65.2">+1</text>
