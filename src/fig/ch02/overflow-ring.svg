  <text class="t-b mid" x="200" y="208">처음으로</text>
  <text class="t-mono mid" x="200" y="326">255 + 1 → 0</text>
  <text class="t-b mid" x="560" y="30">시계: 12시 다음은 1시</text>
  <circle class="box" cx="560" cy="190" r="92"/>
  <text class="t-s mid" x="596" y="132.6">1</text>
  <text class="t-s mid" x="622.4" y="159">2</text>
  <circle class="box blue" cx="632" cy="190" r="15"/>
  <text class="t-b mid" x="632" y="195">3</text>
  <text class="t-s mid" x="622.4" y="231">4</text>
  <text class="t-s mid" x="596" y="257.4">5</text>
  <text class="t-s mid" x="560" y="267">6</text>
  <text class="t-s mid" x="524" y="257.4">7</text>
  <text class="t-s mid" x="497.6" y="231">8</text>
  <text class="t-s mid" x="488" y="195">9</text>
  <circle class="box yellow" cx="497.6" cy="154" r="15"/>
