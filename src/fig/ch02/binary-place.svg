<svg viewBox="0 0 760 212" xmlns="http://www.w3.org/2000/svg">
  <title>스위치 여덟 개 01000001은 자릿값을 더하면 65이고, 네 칸씩 묶으면 16진수 41이다</title>
  <text class="t-s" x="20" y="38">자릿값</text>
