  <text class="t-mono mid" x="401" y="142">0001 → <tspan class="t-b tc-blue">1</tspan></text>
  <text class="t-s mid" x="291" y="182">켜진 자리의 값만 더하면 64 + 1 = 65</text>
  <rect class="box" x="545" y="20" width="195" height="176" rx="12"/>
  <text class="t-s" x="563" y="46">2진수</text>
  <text class="t-mono t-b" x="563" y="68">0100 0001</text>
  <text class="t-s" x="563" y="102">10진수</text>
  <text class="t-mono t-b" x="563" y="124">65</text>
  <text class="t-s" x="563" y="158">16진수</text>
  <text class="t-mono t-b" x="563" y="180">0x41</text>
  <path class="ln thin muted" d="M563 80 H722"/>
  <path class="ln thin muted" d="M563 136 H722"/>
