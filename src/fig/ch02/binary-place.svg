  <text class="t-mono mid t-b" x="155" y="38">64</text>
  <rect class="solid yellow" x="132" y="50" width="46" height="46" rx="9"/>
  <text class="t-l t-on mid" x="155" y="79">1</text>
  <text class="t-mono mid tc-muted" x="207" y="38">32</text>
  <rect class="box gray" x="184" y="50" width="46" height="46" rx="9"/>
  <text class="t-l mid tc-muted" x="207" y="79">0</text>
  <text class="t-mono mid tc-muted" x="259" y="38">16</text>
  <rect class="box gray" x="236" y="50" width="46" height="46" rx="9"/>
  <text class="t-l mid tc-muted" x="259" y="79">0</text>
  <text class="t-mono mid tc-muted" x="323" y="38">8</text>
  <rect class="box gray" x="300" y="50" width="46" height="46" rx="9"/>
  <text class="t-l mid tc-muted" x="323" y="79">0</text>
  <text class="t-mono mid tc-muted" x="375" y="38">4</text>
  <rect class="box gray" x="352" y="50" width="46" height="46" rx="9"/>
  <text class="t-l mid tc-muted" x="375" y="79">0</text>
  <text class="t-mono mid tc-muted" x="427" y="38">2</text>
  <rect class="box gray" x="404" y="50" width="46" height="46" rx="9"/>
  <text class="t-l mid tc-muted" x="427" y="79">0</text>
  <text class="t-mono mid t-b" x="479" y="38">1</text>
  <rect class="solid yellow" x="456" y="50" width="46" height="46" rx="9"/>
  <text class="t-l t-on mid" x="479" y="79">1</text>
  <path class="ln thin" d="M82 106 v8 H280 v-8"/>
  <path class="ln thin" d="M302 106 v8 H500 v-8"/>
  <text class="t-s" x="20" y="142">네 칸씩</text>
