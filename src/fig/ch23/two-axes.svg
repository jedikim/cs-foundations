<svg viewBox="0 0 760 370" xmlns="http://www.w3.org/2000/svg">
  <title>보물 위치에서 내 위치를 빼면 가야 할 화살표 (4, 3)이 나오고, 같은 숫자도 y가 아래로 커지는 화면에서는 아래쪽을 향해 그려진다</title>
  <text class="t-b" x="70" y="34">수학 시간의 좌표계</text>
  <text class="t-s" x="70" y="56">y가 위로 갈수록 커진다</text>
  <text class="t-b" x="440" y="34">화면 좌표계</text>
  <text class="t-s" x="440" y="56">y가 아래로 갈수록 커진다</text>
  <path class="ln thin muted" d="M70 300 V100"/>
  <path class="ln thin muted" d="M110 300 V100"/>
  <path class="ln thin muted" d="M150 300 V100"/>
