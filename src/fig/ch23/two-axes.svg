  <path class="ln thin muted" d="M70 180 H350"/>
  <path class="ln thin muted" d="M70 140 H350"/>
  <path class="ln thin muted" d="M70 100 H350"/>
  <path class="ln" d="M70 300 H364" marker-end="url(#ah)"/>
  <path class="ln" d="M70 300 V86" marker-end="url(#ah)"/>
  <text class="t-s t-b" x="372" y="305">x</text>
  <text class="t-s t-b end" x="62" y="94">y</text>
  <text class="t-xs mid" x="70" y="318">0</text>
  <text class="t-xs mid" x="150" y="318">2</text>
  <text class="t-xs mid" x="230" y="318">4</text>
  <text class="t-xs mid" x="310" y="318">6</text>
  <text class="t-xs end" x="62" y="224">2</text>
  <text class="t-xs end" x="62" y="144">4</text>
  <path class="ln thin warm dash" d="M150 260 H310 V140"/>
  <path class="ln thick blue" d="M156.4 255.2 L302 146" marker-end="url(#ah-blue)"/>
  <circle class="f-blue" cx="150" cy="260" r="6"/>
  <circle class="f-warm" cx="310" cy="140" r="7"/>
  <text class="t-b end" x="140" y="254">나 (2, 1)</text>
  <text class="t-b mid" x="310" y="126">보물 (6, 4)</text>
  <text class="t-s mid tc-warm" x="230" y="278">오른쪽으로 4</text>
  <text class="t-s tc-warm" x="318" y="214">위로 3</text>
  <text class="t-mono t-b end tc-blue" x="218" y="188">(4, 3)</text>
