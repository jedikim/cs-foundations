  <text class="t-xs mid" x="165" y="322">100</text>
  <text class="t-xs mid" x="250" y="322">200</text>
  <text class="t-xs mid" x="335" y="322">300ms</text>
  <path class="ln thick red" d="M80 288 H165 V242 H250 V196 H335 V150"/>
  <circle class="f-warm" cx="80" cy="288" r="5.500"/>
  <circle class="f-warm" cx="165" cy="242" r="5.500"/>
  <circle class="f-warm" cx="250" cy="196" r="5.500"/>
  <circle class="f-warm" cx="335" cy="150" r="5.500"/>
  <text class="t-xs t-b tc-red" x="175" y="270">순간이동</text>
  <text class="t-xs t-b tc-red" x="260" y="224">순간이동</text>

  <rect class="panel" x="390" y="16" width="350" height="330" rx="16"/>
  <text class="t-l" x="410" y="46">0.1초 늦춰 사이를 채우면</text>
  <text class="t-s" x="410" y="68">프레임마다 조금씩 움직인다</text>
  <circle class="f-warm" cx="416" cy="92" r="5"/>
  <text class="t-xs" x="428" y="96">도착한 스냅샷</text>
  <path class="ln green" d="M540 92 H564"/>
  <text class="t-xs" x="572" y="96">화면에 그린 위치</text>
  <text class="t-xs" x="410" y="126">위치(칸)</text>
  <path class="ln thin muted" d="M440 288 H724"/>
