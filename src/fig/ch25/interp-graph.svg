<svg viewBox="0 0 760 362" xmlns="http://www.w3.org/2000/svg">
  <title>스냅샷을 받는 대로 그리면 위치가 계단처럼 건너뛰고, 100ms 늦춰 두 스냅샷 사이를 채우면 매끄럽게 움직인다</title>

  <rect class="panel" x="20" y="16" width="350" height="330" rx="16"/>
