<svg viewBox="0 0 760 306" xmlns="http://www.w3.org/2000/svg">
  <title>문법 오류와 타입 오류는 실행 전에 걸러지고, 실행 중 오류는 그 줄에 닿았을 때 드러난다</title>

  <rect class="panel" x="20" y="16" width="452" height="218" rx="16"/>
  <text class="t-s t-b" x="38" y="44">실행 전 — 번역하면서 걸러진다</text>
  <rect class="panel warm" x="488" y="16" width="252" height="218" rx="16"/>
  <text class="t-s t-b" x="506" y="44">실행 중 — 그 줄에 닿아야 안다</text>

  <rect class="box red" x="36" y="58" width="204" height="160" rx="12"/>
  <circle class="badge red" cx="58" cy="82" r="12"/><text class="badge-t" x="58" y="86.500">1</text>
  <text class="t-b" x="78" y="87">문법 오류</text>
  <rect class="box" x="50" y="100" width="176" height="32" rx="6"/>
  <text class="t-mono" x="60" y="121">(price * 2 + 1</text>
  <text class="t-s" x="52" y="158">괄호가 닫히지 않았다</text>
  <text class="t-s t-b tc-red" x="52" y="184">한 줄도 실행되지 않는다</text>

  <rect class="box red" x="252" y="58" width="204" height="160" rx="12"/>
  <circle class="badge red" cx="274" cy="82" r="12"/><text class="badge-t" x="274" y="86.500">2</text>
  <text class="t-b" x="294" y="87">타입 오류</text>
  <rect class="box" x="266" y="100" width="176" height="32" rx="6"/>
  <text class="t-mono" x="276" y="121">&quot;100&quot; * 2 + 1</text>
  <text class="t-s" x="268" y="158">글자에 숫자를 더하려 했다</text>
  <text class="t-s t-b tc-red" x="268" y="184">검사에서 걸러진다</text>

  <rect class="box red" x="504" y="58" width="220" height="160" rx="12"/>
  <circle class="badge red" cx="526" cy="82" r="12"/><text class="badge-t" x="526" y="86.500">3</text>
  <text class="t-b" x="546" y="87">실행 중 오류</text>
  <rect class="box" x="518" y="100" width="192" height="32" rx="6"/>
  <text class="t-mono" x="528" y="121">total / count</text>
  <text class="t-s" x="520" y="158">count가 0인 날에만 실패</text>
  <text class="t-s t-b tc-red" x="520" y="184">그 순간 프로그램이 멈춘다</text>

  <path class="ln red dash" d="M354 222 V262 H614 V242" marker-end="url(#ah-red)"/>
  <text class="t-s mid" x="484" y="288">Python 같은 언어에서는 타입 오류도 실행 중에야 드러난다</text>
</svg>
