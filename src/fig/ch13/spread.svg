  <path class="ln thin blue dash" d="M470 160 V240"/>
  <path class="ln thin muted" d="M220 230 H720"/>
  <path class="ln thin muted" d="M220 225 V235 M345 225 V235 M470 225 V235 M595 225 V235 M720 225 V235"/>
  <text class="t-xs mid" x="220" y="256">0</text>
  <text class="t-xs mid" x="345" y="256">5</text>
  <text class="t-xs mid" x="470" y="256">10</text>
  <text class="t-xs mid" x="595" y="256">15</text>
  <text class="t-xs mid" x="720" y="256">20</text>
  <circle class="f-warm" cx="245" cy="230" r="8"/>
