<svg viewBox="0 0 760 428" xmlns="http://www.w3.org/2000/svg">
  <title>앱과 주문 서비스가 각각 세 번씩 시도하면 주문 한 건이 아픈 결제 서비스에는 아홉 번의 요청으로 불어난다</title>
  <text class="t-s t-b mid" x="75" y="30">앱</text>
  <text class="t-h mid tc-blue" x="190" y="32">× 3</text>
  <text class="t-s t-b mid" x="320" y="30">주문 서비스가 받는 요청</text>
  <text class="t-h mid tc-red" x="455" y="32">× 3</text>
  <text class="t-s t-b mid" x="580" y="30">결제 서비스가 받는 요청</text>

  <rect class="box blue" x="20" y="166" width="110" height="68" rx="12"/>
  <use href="#i-phone" x="30" y="184" width="32" height="32" class="ic blue"/>
  <text class="t-b" x="68" y="197">주문</text>
  <text class="t-b" x="68" y="217">1건</text>
  <path class="ln blue" d="M134 200 L242 100" marker-end="url(#ah-blue)"/>
  <rect class="box blue" x="250" y="78" width="140" height="44" rx="10"/>
  <text class="t-b mid" x="320" y="105">1번째 시도</text>
  <path class="ln red thin" d="M394 100 L512 70" marker-end="url(#ah-red)"/>
  <rect class="solid red" x="520" y="59" width="120" height="22" rx="5"/>
  <text class="t-on t-xs t-b mid" x="580" y="74">요청 1</text>
  <path class="ln red thin" d="M394 100 L512 100" marker-end="url(#ah-red)"/>
  <rect class="solid red" x="520" y="89" width="120" height="22" rx="5"/>
  <text class="t-on t-xs t-b mid" x="580" y="104">요청 2</text>
  <path class="ln red thin" d="M394 100 L512 130" marker-end="url(#ah-red)"/>
  <rect class="solid red" x="520" y="119" width="120" height="22" rx="5"/>
  <text class="t-on t-xs t-b mid" x="580" y="134">요청 3</text>
  <path class="ln blue" d="M134 200 L242 200" marker-end="url(#ah-blue)"/>
  <rect class="box blue" x="250" y="178" width="140" height="44" rx="10"/>
  <text class="t-b mid" x="320" y="205">2번째 (재시도)</text>
  <path class="ln red thin" d="M394 200 L512 170" marker-end="url(#ah-red)"/>
  <rect class="solid red" x="520" y="159" width="120" height="22" rx="5"/>
  <text class="t-on t-xs t-b mid" x="580" y="174">요청 4</text>
  <path class="ln red thin" d="M394 200 L512 200" marker-end="url(#ah-red)"/>
  <rect class="solid red" x="520" y="189" width="120" height="22" rx="5"/>
  <text class="t-on t-xs t-b mid" x="580" y="204">요청 5</text>
  <path class="ln red thin" d="M394 200 L512 230" marker-end="url(#ah-red)"/>
  <rect class="solid red" x="520" y="219" width="120" height="22" rx="5"/>
  <text class="t-on t-xs t-b mid" x="580" y="234">요청 6</text>
  <path class="ln blue" d="M134 200 L242 300" marker-end="url(#ah-blue)"/>
  <rect class="box blue" x="250" y="278" width="140" height="44" rx="10"/>
  <text class="t-b mid" x="320" y="305">3번째 (재시도)</text>
  <path class="ln red thin" d="M394 300 L512 270" marker-end="url(#ah-red)"/>
  <rect class="solid red" x="520" y="259" width="120" height="22" rx="5"/>
  <text class="t-on t-xs t-b mid" x="580" y="274">요청 7</text>
  <path class="ln red thin" d="M394 300 L512 300" marker-end="url(#ah-red)"/>
  <rect class="solid red" x="520" y="289" width="120" height="22" rx="5"/>
  <text class="t-on t-xs t-b mid" x="580" y="304">요청 8</text>
  <path class="ln red thin" d="M394 300 L512 330" marker-end="url(#ah-red)"/>
  <rect class="solid red" x="520" y="319" width="120" height="22" rx="5"/>
  <text class="t-on t-xs t-b mid" x="580" y="334">요청 9</text>
  <text class="t-l mid tc-red" x="698" y="194">1건이</text>
  <text class="t-l mid tc-red" x="698" y="218">9번으로</text>

  <rect class="box green" x="20" y="362" width="720" height="48" rx="12"/>
  <text class="t-b mid" x="380" y="391">재시도를 한 층에서만 맡으면 1 × 3 = 3번에서 멈춘다</text>
</svg>
