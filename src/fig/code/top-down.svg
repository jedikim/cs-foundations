<svg viewBox="0 0 760 262" xmlns="http://www.w3.org/2000/svg">
  <title>컴퓨터는 코드를 위에서 아래로 한 줄씩 실행하고, 주석은 건너뛴다</title>

  <use href="#i-code" class="ic" x="60" y="12" width="24" height="24"/>
  <text class="t-b" x="92" y="30">코드</text>
  <use href="#i-monitor" class="ic" x="520" y="12" width="24" height="24"/>
  <text class="t-b" x="552" y="30">화면</text>

  <path class="ln blue" d="M34 62 V200" marker-end="url(#ah-blue)"/>

  <rect class="box" x="60" y="46" width="390" height="172" rx="12"/>
  <rect class="s-gray" x="68" y="56" width="374" height="32" rx="6"/>
  <text class="t-mono tc-muted end" x="92" y="77">1</text>
  <text class="t-mono tc-muted" x="106" y="77"># 분식집 주문 합계</text>
  <text class="t-s t-b end tc-warm" x="432" y="77">주석: 건너뜀</text>

  <text class="t-mono tc-muted end" x="92" y="115">2</text>
  <text class="t-mono" x="106" y="115">print("주문을 계산합니다")</text>

  <text class="t-mono tc-muted end" x="92" y="153">3</text>
  <text class="t-mono" x="106" y="153">print(3000 + 4000)</text>

  <text class="t-mono tc-muted end" x="92" y="191">4</text>
  <text class="t-mono" x="106" y="191">print("끝")</text>

  <path class="ln thin blue" d="M460 110 H508" marker-end="url(#ah-blue)"/>
  <path class="ln thin blue" d="M460 148 H508" marker-end="url(#ah-blue)"/>
  <path class="ln thin blue" d="M460 186 H508" marker-end="url(#ah-blue)"/>

  <rect class="panel" x="520" y="46" width="220" height="172" rx="12"/>
  <text class="t-mono t-b" x="538" y="115">주문을 계산합니다</text>
  <text class="t-mono t-b" x="538" y="153">7000</text>
  <text class="t-mono t-b" x="538" y="191">끝</text>

  <text class="t-s" x="60" y="244">위에서 아래로, 앞줄이 끝나야 다음 줄로 갑니다</text>
</svg>
