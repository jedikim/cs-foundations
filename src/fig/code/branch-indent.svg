<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg">
  <title>들여 쓴 줄은 바로 위 if나 else에 딸린 묶음이고, 조건에 따라 한쪽 묶음만 실행된다</title>

  <rect class="box" x="60" y="20" width="350" height="234" rx="12"/>
  <rect class="s-green" x="126" y="92" width="276" height="56" rx="6"/>
  <rect class="s-warm" x="126" y="182" width="276" height="28" rx="6"/>

  <text class="t-mono tc-muted end" x="88" y="51">1</text>
  <text class="t-mono" x="100" y="51">total = 10000</text>
  <text class="t-mono tc-muted end" x="88" y="81">2</text>
  <text class="t-mono t-b" x="100" y="81">if total &gt;= 12000:</text>
  <text class="t-mono tc-muted end" x="88" y="111">3</text>
  <text class="t-mono" x="134" y="111">delivery = 0</text>
  <text class="t-mono tc-muted end" x="88" y="141">4</text>
  <text class="t-mono" x="134" y="141">print("배달비 무료")</text>
  <text class="t-mono tc-muted end" x="88" y="171">5</text>
  <text class="t-mono t-b" x="100" y="171">else:</text>
  <text class="t-mono tc-muted end" x="88" y="201">6</text>
  <text class="t-mono" x="134" y="201">delivery = 2000</text>
  <text class="t-mono tc-muted end" x="88" y="231">7</text>
  <text class="t-mono" x="100" y="231">print(total + delivery)</text>

  <path class="ln thin muted dash" d="M113 92 V148 M113 182 V210"/>

  <path class="ln warm" d="M36 46 V76"/>
  <path class="ln warm dash" d="M36 76 V196"/>
  <path class="ln warm" d="M36 196 V222" marker-end="url(#ah-warm)"/>
  <circle class="badge warm" cx="36" cy="46" r="5"/>
  <circle class="badge warm" cx="36" cy="76" r="5"/>
  <circle class="badge warm" cx="36" cy="196" r="5"/>

  <path class="ln thin muted" d="M410 76 H430"/>
  <text class="t-b" x="440" y="81">조건을 따진다</text>
  <text class="t-s" x="592" y="81">10000은 12000보다 작다</text>

  <path class="ln thin muted" d="M410 120 H430"/>
  <text class="t-b tc-green" x="440" y="125">참일 때의 묶음</text>
  <text class="t-s" x="592" y="125">이번에는 건너뛴다</text>

  <path class="ln thin muted" d="M410 196 H430"/>
  <text class="t-b tc-warm" x="440" y="201">거짓일 때의 묶음</text>
  <text class="t-s" x="592" y="201">이번에 실행된다</text>

  <path class="ln thin muted" d="M410 226 H430"/>
  <text class="t-b" x="440" y="231">들여쓰기가 끝난 줄</text>
  <text class="t-s" x="592" y="231">어느 길이든 실행된다</text>

  <use href="#i-monitor" class="ic" x="60" y="264" width="22" height="22"/>
  <text class="t-s" x="90" y="281">화면에 12000이 찍힌다</text>
</svg>
