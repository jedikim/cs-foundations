<svg viewBox="0 0 760 316" xmlns="http://www.w3.org/2000/svg">
  <title>함수는 한 번 만들어 두고 여러 번 부르며, 부를 때마다 인자가 들어가고 반환값이 돌아온다</title>

  <rect class="panel" x="20" y="16" width="720" height="84" rx="12"/>
  <text class="t-b" x="38" y="46">만들기 (정의)</text>
  <text class="t-s" x="38" y="72">방법을 적어 둘 뿐, 이때는 계산하지 않는다</text>
  <text class="t-mono t-b" x="430" y="46">def get_total(orders):</text>
  <text class="t-mono tc-muted" x="464" y="66">…</text>
  <text class="t-mono t-b" x="464" y="86">return total</text>

  <text class="t-b" x="38" y="134">부르기 (호출)</text>
  <text class="t-s" x="150" y="134">부를 때마다 묶음이 실행된다</text>

  <text class="t-s t-b mid tc-blue" x="150" y="166">인자: 넣는 것</text>
  <text class="t-s t-b mid tc-green" x="620" y="166">반환값: 돌려받는 것</text>

  <rect class="box yellow" x="306" y="178" width="148" height="118" rx="12"/>
  <text class="t-mono t-b mid" x="380" y="234">get_total</text>
  <text class="t-xs mid" x="380" y="256">같은 묶음을 실행</text>

  <rect class="box blue" x="40" y="178" width="220" height="50" rx="10"/>
  <text class="t-mono t-b mid" x="150" y="208">["김밥", "라면"]</text>
  <path class="ln blue" d="M264 203 H296" marker-end="url(#ah-blue)"/>
  <path class="ln green" d="M458 203 H510" marker-end="url(#ah-green)"/>
  <rect class="box green" x="520" y="178" width="200" height="50" rx="10"/>
  <text class="t-mono t-b mid" x="620" y="208">7000</text>

  <rect class="box blue" x="40" y="246" width="220" height="50" rx="10"/>
  <text class="t-mono t-b mid" x="150" y="276">["떡볶이"]</text>
  <path class="ln blue" d="M264 271 H296" marker-end="url(#ah-blue)"/>
  <path class="ln green" d="M458 271 H510" marker-end="url(#ah-green)"/>
  <rect class="box green" x="520" y="246" width="200" height="50" rx="10"/>
  <text class="t-mono t-b mid" x="620" y="276">3500</text>
</svg>
