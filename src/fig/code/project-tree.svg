<svg viewBox="0 0 760 336" xmlns="http://www.w3.org/2000/svg">
  <title>프로젝트 폴더의 파일은 읽을 것, 읽고 고칠 것, 보여 주지 않을 것, 열어서 고치지 않을 것으로 나뉜다</title>

  <use href="#i-folder" class="ic" x="24" y="10" width="26" height="26"/>
  <text class="t-mono t-b" x="58" y="29">bunsik/</text>

  <path class="ln thin muted" d="M37 40 V302 M37 64 H66 M37 98 H66 M37 132 H66 M37 166 H66 M37 200 H66 M37 234 H66 M37 268 H66 M37 302 H66"/>

  <rect class="box blue" x="66" y="50" width="190" height="28" rx="6"/>
  <text class="t-mono t-b" x="78" y="69">README.md</text>
  <circle class="badge blue" cx="278" cy="64" r="11"/><text class="badge-t" x="278" y="68.500">1</text>
  <text class="t-s" x="298" y="69">설명서: 무엇을 하고 어떻게 켜나</text>

  <rect class="box blue" x="66" y="84" width="190" height="28" rx="6"/>
  <text class="t-mono t-b" x="78" y="103">requirements.txt</text>
  <circle class="badge blue" cx="278" cy="98" r="11"/><text class="badge-t" x="278" y="102.500">2</text>
  <text class="t-s" x="298" y="103">필요한 패키지 목록</text>

  <rect class="box green" x="66" y="118" width="190" height="28" rx="6"/>
  <text class="t-mono t-b" x="78" y="137">main.py</text>
  <circle class="badge green" cx="278" cy="132" r="11"/><text class="badge-t" x="278" y="136.500">3</text>
  <text class="t-s" x="298" y="137">시작 파일: 처음 실행되는 코드</text>

  <rect class="box green" x="66" y="152" width="190" height="28" rx="6"/>
  <text class="t-mono t-b" x="78" y="171">menu.py</text>
  <circle class="badge green" cx="278" cy="166" r="11"/><text class="badge-t" x="278" y="170.500">4</text>
  <text class="t-s" x="298" y="171">import 줄을 따라가서 여는 파일</text>

  <rect class="box blue" x="66" y="186" width="190" height="28" rx="6"/>
  <text class="t-mono t-b" x="78" y="205">.gitignore</text>
  <text class="t-s" x="298" y="205">Git에 담지 않을 이름 목록</text>

  <rect class="box red" x="66" y="220" width="190" height="28" rx="6"/>
  <text class="t-mono t-b" x="78" y="239">.env</text>
  <text class="t-s" x="298" y="239">비밀 값</text>

  <rect class="box gray" x="66" y="254" width="190" height="28" rx="6"/>
  <text class="t-mono t-b" x="78" y="273">.venv/</text>
  <text class="t-s" x="298" y="273">설치한 패키지</text>

  <rect class="box gray" x="66" y="288" width="190" height="28" rx="6"/>
  <text class="t-mono t-b" x="78" y="307">.git/</text>
  <text class="t-s" x="298" y="307">Git의 저장 지점</text>

  <rect class="panel" x="548" y="50" width="192" height="164" rx="12"/>
  <text class="t-s t-b" x="564" y="76">색이 뜻하는 것</text>
  <rect class="box blue" x="564" y="90" width="18" height="18" rx="4"/>
  <text class="t-s" x="592" y="104">읽는다</text>
  <rect class="box green" x="564" y="120" width="18" height="18" rx="4"/>
  <text class="t-s" x="592" y="134">읽고 고친다</text>
  <rect class="box red" x="564" y="150" width="18" height="18" rx="4"/>
  <text class="t-s" x="592" y="164">보여 주지 않는다</text>
  <rect class="box gray" x="564" y="180" width="18" height="18" rx="4"/>
  <text class="t-s" x="592" y="194">열어서 고치지 않는다</text>

  <circle class="badge" cx="574" cy="246" r="11"/><text class="badge-t" x="574" y="250.500">1</text>
  <text class="t-s" x="592" y="251">번호는 여는 순서</text>
</svg>
