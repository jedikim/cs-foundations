<svg viewBox="0 0 760 348" xmlns="http://www.w3.org/2000/svg">
  <title>한 줄로 시키면 빈칸을 AI가 짐작으로 채우고, 누가 쓰나·할 수 있는 것·하지 않을 것·다 됐다의 기준을 적어 주면 짐작할 자리가 없다</title>

  <rect class="panel" x="20" y="16" width="284" height="316" rx="16"/>
  <text class="t-l" x="38" y="48">한 줄로 시키면</text>
  <rect class="box" x="36" y="62" width="252" height="40" rx="10"/>
  <text class="mid" x="162" y="87">“독서 기록 앱 만들어 줘”</text>
  <path class="ln muted" d="M162 106 V122" marker-end="url(#ah-muted)"/>
  <text class="t-s t-b" x="38" y="146">AI가 짐작으로 채운 것</text>
  <rect class="box red" x="36" y="156" width="252" height="30" rx="8"/>
  <text class="t-s t-ink" x="48" y="176">로그인 화면</text>
  <text class="t-xs end" x="278" y="176">부탁한 적 없음</text>
  <rect class="box red" x="36" y="192" width="252" height="30" rx="8"/>
  <text class="t-s t-ink" x="48" y="212">친구 추천</text>
  <text class="t-xs end" x="278" y="212">부탁한 적 없음</text>
  <rect class="box red" x="36" y="228" width="252" height="30" rx="8"/>
  <text class="t-s t-ink" x="48" y="248">독서 랭킹</text>
  <text class="t-xs end" x="278" y="248">부탁한 적 없음</text>
  <rect class="ghost dash" x="36" y="268" width="252" height="30" rx="8"/>
  <text class="t-s t-ink" x="48" y="288">한 줄 감상 칸</text>
  <text class="t-xs tc-red end" x="278" y="288">바랐는데 없음</text>
  <text class="t-xs" x="38" y="320">말하지 않은 것은 짐작으로 채워진다</text>

  <rect class="panel green" x="330" y="16" width="410" height="316" rx="16"/>
  <text class="t-l" x="348" y="48">설명서로 적어 주면</text>

  <rect class="box" x="346" y="62" width="378" height="54" rx="10"/>
  <text class="t-s t-b tc-blue" x="360" y="83">누가 쓰나</text>
  <text x="360" y="105">우리 반 친구들이 휴대전화로</text>

  <rect class="box" x="346" y="124" width="378" height="54" rx="10"/>
  <text class="t-s t-b tc-green" x="360" y="145">할 수 있는 것</text>
  <text x="360" y="167">제목과 한 줄 감상 적기, 목록 보기</text>

  <rect class="box" x="346" y="186" width="378" height="54" rx="10"/>
  <text class="t-s t-b tc-red" x="360" y="207">하지 않을 것</text>
  <text x="360" y="229">로그인, 댓글, 책 표지 사진</text>

  <rect class="box" x="346" y="248" width="378" height="54" rx="10"/>
  <text class="t-s t-b tc-purple" x="360" y="269">“다 됐다”의 기준</text>
  <text x="360" y="291">저장을 누르면 목록 맨 위에 나타난다</text>

  <text class="t-xs" x="348" y="320">적어 준 칸에는 짐작이 들어갈 자리가 없다</text>
</svg>
