<svg viewBox="0 0 760 296" xmlns="http://www.w3.org/2000/svg">
  <title>AI에게 일을 시키는 여섯 걸음. 적기와 나누기는 처음에 한 번 하고, 맥락 주기부터 저장하기까지는 조각 하나마다 되풀이한다</title>

  <text class="t-s t-b" x="24" y="32">처음에 한 번</text>
  <rect class="panel" x="14" y="44" width="240" height="150" rx="14"/>
  <text class="t-s t-b" x="280" y="32">작게 자른 일 하나마다 되풀이</text>
  <rect class="panel blue" x="270" y="44" width="476" height="150" rx="14"/>

  <rect class="box" x="24" y="60" width="100" height="118" rx="10"/>
  <circle class="badge warm" cx="74" cy="84" r="12"/><text class="badge-t" x="74" y="88.500">1</text>
  <text class="t-b mid" x="74" y="120">적기</text>
  <text class="t-xs mid" x="74" y="143">만들 것을</text>
  <text class="t-xs mid" x="74" y="160">글로 적는다</text>

  <path class="ln" d="M127 119 H141" marker-end="url(#ah)"/>

  <rect class="box" x="144" y="60" width="100" height="118" rx="10"/>
  <circle class="badge warm" cx="194" cy="84" r="12"/><text class="badge-t" x="194" y="88.500">2</text>
  <text class="t-b mid" x="194" y="120">나누기</text>
  <text class="t-xs mid" x="194" y="143">한 번에</text>
  <text class="t-xs mid" x="194" y="160">한 가지씩</text>

  <path class="ln" d="M247 119 H275" marker-end="url(#ah)"/>

  <rect class="box" x="278" y="60" width="100" height="118" rx="10"/>
  <circle class="badge blue" cx="328" cy="84" r="12"/><text class="badge-t" x="328" y="88.500">3</text>
  <text class="t-b mid" x="328" y="120">맥락 주기</text>
  <text class="t-xs mid" x="328" y="143">필요한 것을</text>
  <text class="t-xs mid" x="328" y="160">보여 준다</text>

  <path class="ln" d="M381 119 H395" marker-end="url(#ah)"/>

  <rect class="box" x="398" y="60" width="100" height="118" rx="10"/>
  <circle class="badge blue" cx="448" cy="84" r="12"/><text class="badge-t" x="448" y="88.500">4</text>
  <text class="t-b mid" x="448" y="120">계획 받기</text>
  <text class="t-xs mid" x="448" y="143">코드보다</text>
  <text class="t-xs mid" x="448" y="160">계획 먼저</text>

  <path class="ln" d="M501 119 H515" marker-end="url(#ah)"/>

  <rect class="box" x="518" y="60" width="100" height="118" rx="10"/>
  <circle class="badge blue" cx="568" cy="84" r="12"/><text class="badge-t" x="568" y="88.500">5</text>
  <text class="t-b mid" x="568" y="120">확인하기</text>
  <text class="t-xs mid" x="568" y="143">내 손으로</text>
  <text class="t-xs mid" x="568" y="160">확인한다</text>

  <path class="ln" d="M621 119 H635" marker-end="url(#ah)"/>

  <rect class="box" x="638" y="60" width="100" height="118" rx="10"/>
  <circle class="badge blue" cx="688" cy="84" r="12"/><text class="badge-t" x="688" y="88.500">6</text>
  <text class="t-b mid" x="688" y="120">저장하기</text>
  <text class="t-xs mid" x="688" y="143">확인한 것만</text>
  <text class="t-xs mid" x="688" y="160">커밋한다</text>

  <path class="ln blue" d="M688 198 V226 H328 V202" marker-end="url(#ah-blue)"/>
  <text class="t-s t-b tc-blue mid" x="508" y="248">다음 조각으로</text>

  <text class="t-s" x="24" y="276">확인에서 걸리면 저장하지 않습니다. 고치게 하거나 되돌립니다.</text>
</svg>
