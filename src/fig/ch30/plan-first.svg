<svg viewBox="0 0 760 336" xmlns="http://www.w3.org/2000/svg">
  <title>코드보다 계획을 먼저 받는다. 계획에는 바꿀 곳, 선택지, 질문이 있고, 내가 고르고 답한 뒤에야 코드를 고친다</title>

  <circle class="badge" cx="32" cy="36" r="12"/><text class="badge-t" x="32" y="40.500">1</text>
  <text class="t-b" x="52" y="41">계획만 달라고 한다</text>
  <rect class="box gray" x="20" y="60" width="180" height="112" rx="12"/>
  <text class="t-s t-ink" x="34" y="86">“별점 주기를</text>
  <text class="t-s t-ink" x="34" y="108">붙이려고 해.</text>
  <text class="t-s t-b t-ink" x="34" y="130">아직 고치지 마.</text>
  <text class="t-s t-b t-ink" x="34" y="152">계획만 보여 줘.”</text>

  <path class="ln" d="M204 116 H220" marker-end="url(#ah)"/>

  <circle class="badge purple" cx="236" cy="36" r="12"/><text class="badge-t" x="236" y="40.500">2</text>
  <text class="t-b" x="256" y="41">AI가 계획을 낸다</text>
  <rect class="box" x="224" y="60" width="296" height="256" rx="12"/>
  <text class="t-s t-b tc-blue" x="238" y="84">바꿀 곳</text>
  <text class="t-mono" x="238" y="108">index.html</text>
  <text class="t-s" x="380" y="108">별 고르는 칸</text>
  <text class="t-mono" x="238" y="130">records.py</text>
  <text class="t-s" x="380" y="130">별점도 저장</text>
  <text class="t-mono" x="238" y="152">test_records.py</text>
  <text class="t-s" x="380" y="152">테스트 추가</text>
  <path class="ln thin muted" d="M238 166 H506"/>
  <text class="t-s t-b tc-purple" x="238" y="188">선택지</text>
  <text class="t-s t-ink" x="238" y="212">A  별 모양을 눌러 고르기</text>
  <text class="t-s t-ink" x="238" y="234">B  1~5 숫자를 골라 넣기</text>
  <path class="ln thin muted" d="M238 248 H506"/>
  <text class="t-s t-b tc-warm" x="238" y="270">질문</text>
  <text class="t-s t-ink" x="238" y="294">별점을 안 고르면? 예전 기록은?</text>

  <path class="ln" d="M524 116 H540" marker-end="url(#ah)"/>

  <circle class="badge green" cx="556" cy="36" r="12"/><text class="badge-t" x="556" y="40.500">3</text>
  <text class="t-b" x="576" y="41">내가 정해 준다</text>
  <rect class="box green" x="544" y="60" width="196" height="136" rx="12"/>
  <text class="t-s t-b t-ink" x="558" y="86">“B로 해 줘.</text>
  <text class="t-s t-ink" x="558" y="108">안 고르면 저장하지</text>
  <text class="t-s t-ink" x="558" y="130">말고 알려 줘.</text>
  <text class="t-s t-ink" x="558" y="152">예전 기록은 별 없이</text>
  <text class="t-s t-ink" x="558" y="174">그대로 둬.”</text>

  <path class="ln green" d="M642 200 V226" marker-end="url(#ah-green)"/>

  <rect class="box blue" x="544" y="232" width="196" height="84" rx="12"/>
  <circle class="badge blue" cx="566" cy="258" r="12"/><text class="badge-t" x="566" y="262.500">4</text>
  <text class="t-b" x="586" y="263">그다음에 코드</text>
  <text class="t-s" x="558" y="294">정해 준 계획대로 고친다</text>
</svg>
