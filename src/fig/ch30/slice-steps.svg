<svg viewBox="0 0 760 286" xmlns="http://www.w3.org/2000/svg">
  <title>독서 기록 앱을 다섯 조각으로 나누고, 조각마다 끝났을 때 화면에서 확인할 것을 정해 둔다</title>

  <text class="t-s t-b" x="24" y="30">첫 판: 설명서에 적은 것</text>
  <rect class="panel" x="14" y="40" width="428" height="200" rx="14"/>
  <text class="t-s t-b" x="468" y="30">써 본 친구들이 바란 것</text>
  <rect class="panel yellow" x="458" y="40" width="288" height="200" rx="14"/>

  <path class="ln muted" d="M30 66 H728" marker-end="url(#ah-muted)"/>

  <circle class="badge blue" cx="88" cy="66" r="12"/><text class="badge-t" x="88" y="70.500">1</text>
  <rect class="box" x="22" y="88" width="132" height="138" rx="10"/>
  <text class="t-b mid" x="88" y="114">목록 보기</text>
  <path class="ln thin muted" d="M34 126 H142"/>
  <text class="t-xs mid" x="88" y="148">화면에서 볼 것</text>
  <text class="t-s t-ink mid" x="88" y="176">넣어 둔 기록</text>
  <text class="t-s t-ink mid" x="88" y="196">2개가 보인다</text>

  <circle class="badge blue" cx="228" cy="66" r="12"/><text class="badge-t" x="228" y="70.500">2</text>
  <rect class="box" x="162" y="88" width="132" height="138" rx="10"/>
  <text class="t-b mid" x="228" y="114">기록 추가</text>
  <path class="ln thin muted" d="M174 126 H282"/>
  <text class="t-xs mid" x="228" y="148">화면에서 볼 것</text>
  <text class="t-s t-ink mid" x="228" y="176">저장하면 목록</text>
  <text class="t-s t-ink mid" x="228" y="196">맨 위에 나타난다</text>

  <circle class="badge blue" cx="368" cy="66" r="12"/><text class="badge-t" x="368" y="70.500">3</text>
  <rect class="box" x="302" y="88" width="132" height="138" rx="10"/>
  <text class="t-b mid" x="368" y="114">남기기</text>
  <path class="ln thin muted" d="M314 126 H422"/>
  <text class="t-xs mid" x="368" y="148">화면에서 볼 것</text>
  <text class="t-s t-ink mid" x="368" y="176">껐다 켜도</text>
  <text class="t-s t-ink mid" x="368" y="196">기록이 남아 있다</text>

  <circle class="badge warm" cx="532" cy="66" r="12"/><text class="badge-t" x="532" y="70.500">4</text>
  <rect class="box" x="466" y="88" width="132" height="138" rx="10"/>
  <text class="t-b mid" x="532" y="114">별점 주기</text>
  <path class="ln thin muted" d="M478 126 H586"/>
  <text class="t-xs mid" x="532" y="148">화면에서 볼 것</text>
  <text class="t-s t-ink mid" x="532" y="176">준 만큼</text>
  <text class="t-s t-ink mid" x="532" y="196">별이 보인다</text>

  <circle class="badge warm" cx="672" cy="66" r="12"/><text class="badge-t" x="672" y="70.500">5</text>
  <rect class="box" x="606" y="88" width="132" height="138" rx="10"/>
  <text class="t-b mid" x="672" y="114">제목으로 찾기</text>
  <path class="ln thin muted" d="M618 126 H726"/>
  <text class="t-xs mid" x="672" y="148">화면에서 볼 것</text>
  <text class="t-s t-ink mid" x="672" y="176">‘모모’를 치면</text>
  <text class="t-s t-ink mid" x="672" y="196">그 기록만 보인다</text>

  <text class="t-s" x="24" y="266">조각 하나를 끝낼 때마다 눌러 보고, 되면 다음 조각으로 갑니다.</text>
</svg>
