  <text class="t-mono t-b mid" x="662" y="172">8</text>
  <text class="t-mono t-b mid" x="618" y="208">5</text>
  <text class="t-mono t-b mid" x="662" y="208">0</text>
  <text class="t-mono t-b mid" x="640" y="256">모양 [2, 3, 2]</text>
  <text class="t-xs mid" x="640" y="278">2일 × 국 3종 × 맛 2가지 = 12개</text>
</svg>
