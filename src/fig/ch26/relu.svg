<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg">
  <title>ReLU는 음수를 0으로 꺾어 직선을 꺾인 선으로 바꾸고, 꺾인 선 두 개를 더하면 직선으로는 만들 수 없는 산 모양이 나온다</title>

  <text class="t-b" x="20" y="30">ReLU 하나: 음수는 0으로 꺾는다</text>
  <path class="ln thin" d="M70 250 H318" marker-end="url(#ah)"/>
  <path class="ln thin" d="M70 322 V52" marker-end="url(#ah)"/>
  <path class="ln thin" d="M66 310 H74 M66 190 H74 M66 70 H74 M125 246 V254 M180 246 V254 M290 246 V254"/>
  <text class="t-xs end" x="58" y="74">9</text>
  <text class="t-xs end" x="58" y="194">3</text>
  <text class="t-xs end" x="58" y="254">0</text>
  <text class="t-xs end" x="58" y="314">−3</text>
  <text class="t-xs mid" x="180" y="272">1</text>
  <text class="t-xs mid" x="290" y="272">2</text>
  <text class="t-s" x="326" y="255">x</text>

  <path class="ln muted dash" d="M70 310 L125 250"/>
  <path class="ln thick blue" d="M70 250 L125 250 L290 70"/>
  <circle class="f-gray" cx="70" cy="310" r="4.500"/>
  <circle class="f-blue" cx="70" cy="250" r="4.500"/>
  <circle class="f-warm" cx="125" cy="250" r="5"/>
  <circle class="f-blue" cx="180" cy="190" r="4.500"/>
  <circle class="f-blue" cx="290" cy="70" r="4.500"/>
  <text class="t-mono" x="192" y="198">(1, 3)</text>
  <text class="t-mono" x="302" y="76">(2, 9)</text>
  <text class="t-s tc-warm" x="112" y="298">x = 0.5에서 꺾인다</text>
  <path class="ln thin warm" d="M140 284 L128 258"/>

  <path class="ln thick blue" d="M84 84 H108"/>
  <text class="t-s" x="116" y="88">3 × ReLU(2x − 1)</text>
  <path class="ln muted dash" d="M84 108 H108"/>
  <text class="t-s" x="116" y="112">ReLU 없이: 6x − 3</text>

  <path class="ln thin muted" d="M385 20 V322"/>

  <text class="t-b" x="410" y="30">ReLU 둘을 더하면: 산 모양</text>
  <text class="t-mono" x="410" y="54">ReLU(x) − 2 × ReLU(x − 1)</text>
  <path class="ln thin" d="M450 250 H708" marker-end="url(#ah)"/>
  <path class="ln thin" d="M450 250 V84" marker-end="url(#ah)"/>
  <path class="ln thin" d="M446 120 H454 M560 246 V254 M670 246 V254"/>
  <text class="t-xs end" x="438" y="124">1</text>
  <text class="t-xs end" x="438" y="254">0</text>
  <text class="t-xs mid" x="560" y="270">1</text>
  <text class="t-xs mid" x="670" y="270">2</text>
  <text class="t-s" x="716" y="255">x</text>

  <path class="ln thin muted dash" d="M560 120 L592 82"/>
  <text class="t-xs" x="600" y="90">첫째만 있었다면</text>
  <path class="ln thick purple" d="M450 250 L560 120 L670 250"/>
  <circle class="f-purple" cx="450" cy="250" r="4.500"/>
  <circle class="f-purple" cx="560" cy="120" r="4.500"/>
  <circle class="f-purple" cx="670" cy="250" r="4.500"/>
  <text class="t-mono end" x="546" y="116">(1, 1)</text>
  <text class="t-s" x="450" y="296">x가 1보다 작을 때: 첫째만 켜져 올라간다</text>
  <text class="t-s" x="450" y="316">x가 1을 넘으면: 둘째도 켜져 내려간다</text>
</svg>
