<svg viewBox="0 0 760 316" xmlns="http://www.w3.org/2000/svg">
  <title>행렬 곱의 한 칸은 왼쪽 표의 행 하나와 오른쪽 표의 열 하나를 같은 자리끼리 곱해 더한 가중합이다</title>

  <text class="t-b" x="96" y="34">주문표 X</text>
  <text class="t-xs" x="96" y="54">[주문 2, 사람 2]</text>
  <text class="t-xs mid" x="124" y="88">어른</text>
  <text class="t-xs mid" x="180" y="88">아이</text>
  <text class="t-s end" x="88" y="121">주문 A</text>
  <text class="t-s end" x="88" y="161">주문 B</text>
  <rect class="box warm" x="96" y="96" width="56" height="40" rx="6"/>
  <rect class="box warm" x="152" y="96" width="56" height="40" rx="6"/>
  <rect class="box" x="96" y="136" width="56" height="40" rx="6"/>
  <rect class="box" x="152" y="136" width="56" height="40" rx="6"/>
  <text class="t-mono t-b mid" x="124" y="121">2</text>
  <text class="t-mono t-b mid" x="180" y="121">1</text>
  <text class="t-mono mid" x="124" y="161">1</text>
  <text class="t-mono mid" x="180" y="161">3</text>

  <text class="t-h mid" x="240" y="142">×</text>

  <text class="t-b" x="350" y="34">레시피표 W</text>
  <text class="t-xs" x="350" y="54">[사람 2, 양념 2]</text>
  <text class="t-xs mid" x="378" y="88">소금</text>
  <text class="t-xs mid" x="434" y="88">고춧가루</text>
  <text class="t-s end" x="342" y="121">어른 1명당</text>
  <text class="t-s end" x="342" y="161">아이 1명당</text>
  <rect class="box warm" x="350" y="96" width="56" height="40" rx="6"/>
  <rect class="box" x="406" y="96" width="56" height="40" rx="6"/>
  <rect class="box warm" x="350" y="136" width="56" height="40" rx="6"/>
  <rect class="box" x="406" y="136" width="56" height="40" rx="6"/>
  <text class="t-mono t-b mid" x="378" y="121">3</text>
  <text class="t-mono mid" x="434" y="121">2</text>
  <text class="t-mono t-b mid" x="378" y="161">1</text>
  <text class="t-mono mid" x="434" y="161">0</text>

  <text class="t-h mid" x="496" y="142">=</text>

  <text class="t-b" x="584" y="34">넣을 양념 XW</text>
  <text class="t-xs" x="584" y="54">[주문 2, 양념 2]</text>
  <text class="t-xs mid" x="612" y="88">소금</text>
  <text class="t-xs mid" x="668" y="88">고춧가루</text>
  <text class="t-s end" x="576" y="121">주문 A</text>
  <text class="t-s end" x="576" y="161">주문 B</text>
  <rect class="solid warm" x="584" y="96" width="56" height="40" rx="6"/>
  <rect class="box" x="640" y="96" width="56" height="40" rx="6"/>
  <rect class="box" x="584" y="136" width="56" height="40" rx="6"/>
  <rect class="box" x="640" y="136" width="56" height="40" rx="6"/>
  <text class="t-mono t-b t-on mid" x="612" y="121">7</text>
  <text class="t-mono mid" x="668" y="121">4</text>
  <text class="t-mono mid" x="612" y="161">6</text>
  <text class="t-mono mid" x="668" y="161">2</text>

  <rect class="box warm" x="20" y="202" width="720" height="46" rx="10"/>
  <text class="t-b" x="38" y="231">주문 A의 소금 = 어른 2 × 3 + 아이 1 × 1 = 7</text>
  <text class="t-s end" x="722" y="230">행 하나 × 열 하나 = 가중합 한 번</text>

  <rect class="box gray" x="20" y="258" width="720" height="40" rx="10"/>
  <text class="t-s" x="38" y="283">나머지 세 칸</text>
  <text class="t-mono" x="150" y="283">2×2 + 1×0 = 4</text>
  <text class="t-mono" x="340" y="283">1×3 + 3×1 = 6</text>
  <text class="t-mono" x="530" y="283">1×2 + 3×0 = 2</text>
</svg>
