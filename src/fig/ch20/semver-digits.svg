<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg">
  <title>버전 번호 1.4.2의 세 자리는 각각 주 버전, 부 버전, 수 버전이며 올라가는 자리에 따라 위험이 다르다</title>
  <text class="t-h" x="20" y="34">버전 번호의 세 자리</text>

  <text class="t-mono end" x="276" y="90">chart-lib</text>
  <rect class="solid red" x="290" y="60" width="48" height="48" rx="8"/>
  <text class="t-h t-on mid" x="314" y="91">1</text>
  <circle class="f-ink" cx="347" cy="102" r="3"/>
  <rect class="solid warm" x="356" y="60" width="48" height="48" rx="8"/>
  <text class="t-h t-on mid" x="380" y="91">4</text>
  <circle class="f-ink" cx="413" cy="102" r="3"/>
  <rect class="solid green" x="422" y="60" width="48" height="48" rx="8"/>
  <text class="t-h t-on mid" x="446" y="91">2</text>

  <path class="ln red" d="M314 113 V128 H140 V142" marker-end="url(#ah-red)"/>
  <path class="ln warm" d="M380 113 V142" marker-end="url(#ah-warm)"/>
  <path class="ln green" d="M446 113 V128 H620 V142" marker-end="url(#ah-green)"/>

  <rect class="box red" x="30" y="150" width="220" height="136" rx="14"/>
  <text class="t-l mid" x="140" y="180">주 버전 (major)</text>
  <text class="t-s mid" x="140" y="202">쓰는 법이 바뀌었다</text>
  <rect class="box" x="70" y="214" width="140" height="30" rx="8"/>
  <text class="t-mono mid" x="140" y="234">1.4.2 → 2.0.0</text>
  <text class="t-s t-b mid tc-red" x="140" y="268">내 코드를 고쳐야 할 수 있다</text>

  <rect class="box warm" x="270" y="150" width="220" height="136" rx="14"/>
  <text class="t-l mid" x="380" y="180">부 버전 (minor)</text>
  <text class="t-s mid" x="380" y="202">기능이 늘었다</text>
  <rect class="box" x="310" y="214" width="140" height="30" rx="8"/>
  <text class="t-mono mid" x="380" y="234">1.4.2 → 1.5.0</text>
  <text class="t-s t-b mid tc-warm" x="380" y="268">쓰던 코드는 그대로 돈다</text>

  <rect class="box green" x="510" y="150" width="220" height="136" rx="14"/>
  <text class="t-l mid" x="620" y="180">수 버전 (patch)</text>
  <text class="t-s mid" x="620" y="202">버그만 고쳤다</text>
  <rect class="box" x="550" y="214" width="140" height="30" rx="8"/>
  <text class="t-mono mid" x="620" y="234">1.4.2 → 1.4.3</text>
  <text class="t-s t-b mid tc-green" x="620" y="268">쓰던 코드는 그대로 돈다</text>

  <text class="t-xs" x="30" y="312">버전 번호는 만든 사람의 약속입니다. 검사 결과가 아닙니다.</text>
</svg>
