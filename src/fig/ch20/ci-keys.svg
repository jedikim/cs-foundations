<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg">
  <title>검사와 배포를 한 작업에 맡기면 밖에서 온 코드가 배포 열쇠를 읽을 수 있고, 작업을 나누면 열쇠는 배포 작업에만 남는다</title>
  <rect class="panel red" x="20" y="20" width="330" height="290" rx="14"/>
  <text class="t-l" x="38" y="52">한 작업에 다 맡기면</text>

  <rect class="box" x="38" y="68" width="294" height="168" rx="12"/>
  <text class="t-s t-b" x="54" y="92">검사 + 배포 작업</text>
  <use href="#i-code" x="54" y="104" width="32" height="32" class="ic purple"/>
  <text class="t-b" x="98" y="118">밖에서 온 코드</text>
  <text class="t-xs" x="98" y="136">누구나 보낼 수 있다</text>
  <path class="ln red" d="M70 142 V176" marker-end="url(#ah-red)"/>
  <text class="t-xs t-b tc-red" x="84" y="164">같은 작업이라 읽을 수 있다</text>
  <use href="#i-key" x="54" y="186" width="32" height="32" class="ic warm"/>
  <text class="t-b" x="98" y="200">배포 열쇠</text>
  <text class="t-mono" x="98" y="220">DEPLOY_KEY</text>

  <text class="t-s t-b tc-red" x="38" y="264">열쇠가 밖으로 새어 나간다</text>
  <text class="t-xs" x="38" y="286">사람이 검토하기도 전에 실행되기 때문</text>

  <rect class="panel green" x="380" y="20" width="360" height="290" rx="14"/>
  <text class="t-l" x="398" y="52">작업을 둘로 나누면</text>

  <rect class="box blue" x="398" y="68" width="324" height="88" rx="12"/>
  <use href="#i-code" x="412" y="82" width="32" height="32" class="ic purple"/>
  <text class="t-b" x="456" y="96">검사 작업</text>
  <text class="t-s" x="456" y="116">밖에서 온 코드도 실행한다</text>
  <text class="t-xs t-b tc-blue" x="456" y="140">읽기 권한만, 열쇠 없음</text>

  <path class="ln" d="M560 160 V186" marker-end="url(#ah)"/>
  <text class="t-xs" x="574" y="178">검토하고 합친 뒤에만</text>

  <rect class="box" x="398" y="196" width="324" height="98" rx="12"/>
  <use href="#i-key" x="412" y="212" width="32" height="32" class="ic warm"/>
  <text class="t-b" x="456" y="224">배포 작업</text>
  <text class="t-s" x="456" y="244">합쳐진 코드만 실행한다</text>
  <text class="t-xs t-b tc-warm" x="456" y="268">배포 열쇠는 여기에만</text>
</svg>
