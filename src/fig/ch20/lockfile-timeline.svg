<svg viewBox="0 0 760 346" xmlns="http://www.w3.org/2000/svg">
  <title>잠금 파일이 없으면 설치하는 날에 따라 버전이 달라지고, 있으면 언제 설치해도 같은 버전이 깔린다</title>
