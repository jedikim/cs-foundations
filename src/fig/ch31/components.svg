<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg">
  <title>기록 카드라는 컴포넌트 하나를 만들어 두고 기록 수만큼 찍어 내며, 같은 카드를 노트북에서는 세 칸으로 휴대전화에서는 한 줄로 늘어놓는다</title>

  <rect class="box purple" x="20" y="30" width="190" height="170" rx="14"/>
  <text class="t-b mid" x="115" y="56">기록 카드</text>
  <text class="t-xs mid" x="115" y="74">컴포넌트 (틀 하나)</text>
  <rect class="box" x="36" y="88" width="158" height="96" rx="8"/>
  <text class="t-b" x="48" y="114">책 제목</text>
  <text class="t-s" x="48" y="138">한 줄 감상</text>
  <text class="t-xs" x="48" y="168">고치기 · 지우기</text>
  <text class="t-s" x="20" y="232">틀은 한 번만 만들고</text>
  <text class="t-s" x="20" y="252">기록 수만큼 찍어 낸다</text>

  <path class="ln purple" d="M216 115 H243" marker-end="url(#ah-purple)"/>

  <rect class="panel" x="250" y="44" width="300" height="132" rx="12"/>
  <text class="t-xs" x="264" y="66">노트북: 세 칸</text>
  <rect class="box purple" x="264" y="78" width="86" height="66" rx="8"/>
  <text class="t-s t-ink t-b" x="274" y="100">모모</text>
  <path class="ln thin muted" d="M274 114 H336 M274 128 H316"/>
  <rect class="box purple" x="357" y="78" width="86" height="66" rx="8"/>
  <text class="t-s t-ink t-b" x="367" y="100">홍길동전</text>
  <path class="ln thin muted" d="M367 114 H429 M367 128 H409"/>
  <rect class="box purple" x="450" y="78" width="86" height="66" rx="8"/>
  <text class="t-s t-ink t-b" x="460" y="100">어린 왕자</text>
  <path class="ln thin muted" d="M460 114 H522 M460 128 H502"/>
  <rect class="solid gray" x="234" y="180" width="332" height="8" rx="4"/>

  <path class="ln" d="M572 115 H603" marker-end="url(#ah)"/>

  <rect class="panel" x="610" y="18" width="130" height="264" rx="18"/>
  <text class="t-xs mid" x="675" y="42">휴대전화: 한 줄</text>
  <rect class="box purple" x="622" y="54" width="106" height="66" rx="8"/>
  <text class="t-s t-ink t-b" x="632" y="76">모모</text>
  <path class="ln thin muted" d="M632 90 H710 M632 104 H684"/>
  <rect class="box purple" x="622" y="128" width="106" height="66" rx="8"/>
  <text class="t-s t-ink t-b" x="632" y="150">홍길동전</text>
  <path class="ln thin muted" d="M632 164 H710 M632 178 H684"/>
  <rect class="box purple" x="622" y="202" width="106" height="66" rx="8"/>
  <text class="t-s t-ink t-b" x="632" y="224">어린 왕자</text>
  <path class="ln thin muted" d="M632 238 H710 M632 252 H684"/>

  <text class="t-s mid" x="400" y="226">같은 카드를 화면 폭에 따라</text>
  <text class="t-s mid" x="400" y="246">다르게 늘어놓는다</text>
</svg>
