<svg viewBox="0 0 760 364" xmlns="http://www.w3.org/2000/svg">
  <title>환경 변수 가운데 이름이 PUBLIC_으로 시작하는 값은 화면 코드에 들어가 누구나 볼 수 있고, 그 밖의 값은 서버에만 남는다</title>

  <rect class="box" x="20" y="20" width="300" height="262" rx="12"/>
  <use href="#i-file" x="32" y="30" width="28" height="28" class="ic"/>
  <text class="t-mono t-b" x="68" y="50">.env</text>
  <text class="t-xs" x="112" y="49">비밀 값을 적어 두는 파일</text>

  <rect class="box blue" x="32" y="72" width="276" height="58" rx="8"/>
  <text class="t-mono" x="42" y="95">PUBLIC_DB_URL=https://…</text>
  <text class="t-mono" x="42" y="118">PUBLIC_DB_KEY=pub_3f9a27</text>
  <text class="t-xs" x="36" y="150">주소와 공개용 키: 보여도 되는 값</text>

  <rect class="box red" x="32" y="186" width="276" height="44" rx="8"/>
  <text class="t-mono" x="42" y="213">DB_SECRET_KEY=sec_71c2e8</text>
  <text class="t-xs" x="36" y="250">비밀 키: 규칙을 건너뛰는 열쇠</text>

  <path class="ln blue" d="M326 100 H462" marker-end="url(#ah-blue)"/>
  <text class="t-xs t-b tc-blue mid" x="394" y="90">PUBLIC_으로 시작</text>
  <path class="ln green" d="M326 208 H462" marker-end="url(#ah-green)"/>
  <text class="t-xs t-b tc-green mid" x="394" y="198">그 밖의 이름</text>

  <rect class="box blue" x="470" y="44" width="270" height="112" rx="12"/>
  <use href="#i-browser" x="484" y="56" width="34" height="34" class="ic blue"/>
  <text class="t-b" x="528" y="79">화면 코드에 들어간다</text>
  <text class="t-s" x="484" y="114">친구들의 브라우저로 보내진다</text>
  <text class="t-s t-b tc-blue" x="484" y="138">누구나 볼 수 있다</text>

  <rect class="box green" x="470" y="170" width="270" height="112" rx="12"/>
  <use href="#i-lock" x="484" y="182" width="34" height="34" class="ic green"/>
  <text class="t-b" x="528" y="205">서버에만 남는다</text>
  <text class="t-s" x="484" y="240">서버 코드만 읽는다</text>
  <text class="t-s t-b tc-green" x="484" y="264">브라우저로 가지 않는다</text>

  <rect class="box red" x="20" y="300" width="720" height="44" rx="10"/>
  <use href="#i-warn" x="32" y="307" width="30" height="30" class="ic red"/>
  <text x="74" y="327">비밀 키 이름에 PUBLIC_을 붙이면 비밀이 화면 코드로 나간다</text>
</svg>
