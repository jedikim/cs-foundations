<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg">
  <title>독서 기록 앱은 로그인 화면과 내 기록 화면 두 장으로 이루어지고, 이번에 하는 것 네 가지와 하지 않는 것을 미리 정해 둔다</title>

  <rect class="box" x="20" y="20" width="190" height="300" rx="16"/>
  <use href="#i-book" x="93" y="70" width="44" height="44" class="ic blue"/>
  <text class="t-l mid" x="115" y="144">독서 기록</text>
  <text class="t-s mid" x="115" y="166">우리 반 독서 기록장</text>
  <rect class="solid blue" x="62" y="194" width="120" height="36" rx="8"/>
  <text class="t-on t-b mid" x="122" y="217">로그인</text>
  <circle class="badge blue" cx="42" cy="212" r="12"/><text class="badge-t" x="42" y="216.500">1</text>
  <text class="t-xs mid" x="115" y="302">로그인 화면</text>

  <path class="ln" d="M216 170 H242" marker-end="url(#ah)"/>

  <rect class="box" x="250" y="20" width="270" height="300" rx="16"/>
  <text class="t-b" x="266" y="50">서연이의 독서 기록</text>
  <text class="t-xs end" x="504" y="50">로그아웃</text>
  <path class="ln thin muted" d="M264 62 H506"/>

  <circle class="badge blue" cx="276" cy="105" r="12"/><text class="badge-t" x="276" y="109.500">2</text>
  <rect class="box gray" x="296" y="74" width="210" height="28" rx="6"/>
  <text class="t-s" x="306" y="93">책 제목</text>
  <rect class="box gray" x="296" y="108" width="144" height="28" rx="6"/>
  <text class="t-s" x="306" y="127">한 줄 감상</text>
  <rect class="solid blue" x="446" y="108" width="60" height="28" rx="6"/>
  <text class="t-on t-b mid" x="476" y="127">저장</text>

  <circle class="badge blue" cx="276" cy="179" r="12"/><text class="badge-t" x="276" y="183.500">3</text>
  <rect class="box blue" x="296" y="152" width="210" height="54" rx="8"/>
  <text class="t-b" x="308" y="174">홍길동전</text>
  <text class="t-xs end" x="496" y="174">고치기 · 지우기</text>
  <text class="t-xs" x="308" y="194">집을 떠나는 장면이 슬펐다</text>

  <circle class="badge blue" cx="276" cy="241" r="12"/><text class="badge-t" x="276" y="245.500">4</text>
  <rect class="box blue" x="296" y="214" width="210" height="54" rx="8"/>
  <text class="t-b" x="308" y="236">어린 왕자</text>
  <text class="t-xs end" x="496" y="236">고치기 · 지우기</text>
  <text class="t-xs" x="308" y="256">여우가 한 말이 오래 남는다</text>
  <text class="t-xs mid" x="385" y="302">내 기록 화면</text>

  <rect class="panel green" x="540" y="20" width="200" height="158" rx="12"/>
  <text class="t-b" x="554" y="46">이번에 하는 것</text>
  <circle class="badge blue" cx="566" cy="72" r="12"/><text class="badge-t" x="566" y="76.500">1</text>
  <text class="t-s" x="586" y="76.500">로그인한다</text>
  <circle class="badge blue" cx="566" cy="99" r="12"/><text class="badge-t" x="566" y="103.500">2</text>
  <text class="t-s" x="586" y="103.500">제목과 감상을 적는다</text>
  <circle class="badge blue" cx="566" cy="126" r="12"/><text class="badge-t" x="566" y="130.500">3</text>
  <text class="t-s" x="586" y="130.500">내 기록만 본다</text>
  <circle class="badge blue" cx="566" cy="153" r="12"/><text class="badge-t" x="566" y="157.500">4</text>
  <text class="t-s" x="586" y="157.500">고치고 지운다</text>

  <rect class="panel" x="540" y="190" width="200" height="130" rx="12"/>
  <text class="t-b" x="554" y="216">이번에 하지 않는 것</text>
  <use href="#i-cross" x="554" y="232" width="20" height="20" class="ic red"/>
  <text class="t-s" x="582" y="246.500">남의 기록 보기</text>
  <use href="#i-cross" x="554" y="258" width="20" height="20" class="ic red"/>
  <text class="t-s" x="582" y="272.500">댓글, 별점</text>
  <use href="#i-cross" x="554" y="284" width="20" height="20" class="ic red"/>
  <text class="t-s" x="582" y="298.500">책 표지 사진 올리기</text>
</svg>
