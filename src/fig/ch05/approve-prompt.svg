<svg viewBox="0 0 760 336" xmlns="http://www.w3.org/2000/svg">
  <title>AI 도구가 명령을 실행해도 되는지 물을 때는 어디에서 실행되는지, 무엇을 하는지, 되돌릴 수 있는지를 확인한 뒤에 허용한다</title>

  <rect class="box" x="20" y="20" width="290" height="206" rx="12"/>
  <path class="ln thin muted" d="M20 50 H310"/>
  <circle class="f-gray" cx="40" cy="35" r="5"/>
  <circle class="f-gray" cx="56" cy="35" r="5"/>
  <circle class="f-gray" cx="72" cy="35" r="5"/>
  <text class="t-s t-b mid" x="190" y="40">AI 코딩 도구</text>
  <text class="t-b" x="38" y="84">이 명령을 실행할까요?</text>
  <rect class="box gray" x="36" y="98" width="258" height="44" rx="8"/>
  <text class="t-mono t-b" x="50" y="125">rm -rf build/*</text>
  <rect class="solid blue" x="36" y="162" width="122" height="40" rx="8"/>
  <text class="t-on t-b mid" x="97" y="187">허용</text>
  <rect class="box" x="172" y="162" width="122" height="40" rx="8"/>
  <text class="t-b mid" x="233" y="187">거절</text>

  <text class="t-s" x="20" y="258">허용을 누르면 내 컴퓨터에서 곧바로 실행됩니다.</text>
  <text class="t-s" x="20" y="280">오른쪽 세 가지를 확인한 뒤에 누릅니다.</text>

  <path class="ln" d="M316 120 H340" marker-end="url(#ah)"/>

  <rect class="box blue" x="350" y="20" width="390" height="92" rx="12"/>
  <circle class="badge blue" cx="374" cy="44" r="12"/><text class="badge-t" x="374" y="48.5">1</text>
  <text class="t-b" x="396" y="49">어디에서 실행되나</text>
  <text class="t-s" x="396" y="74">도구가 서 있는 폴더</text>
  <text class="t-mono" x="528" y="74">/Users/mina/mygame</text>
  <text class="t-xs" x="396" y="96">상대 경로와 별표는 이 폴더에서 출발한다</text>

  <rect class="box warm" x="350" y="122" width="390" height="92" rx="12"/>
  <circle class="badge warm" cx="374" cy="146" r="12"/><text class="badge-t" x="374" y="150.5">2</text>
  <text class="t-b" x="396" y="151">무엇을 하나</text>
  <text class="t-mono t-b" x="396" y="176">rm</text>
  <text class="t-s" x="420" y="176">지워라</text>
  <text class="t-mono t-b" x="478" y="176">-rf</text>
  <text class="t-s" x="510" y="176">폴더 속까지, 묻지 말고</text>
  <text class="t-mono t-b" x="396" y="198">build/*</text>
  <text class="t-s" x="462" y="198">build 폴더 안의 전부</text>

  <rect class="box green" x="350" y="224" width="390" height="92" rx="12"/>
  <circle class="badge green" cx="374" cy="248" r="12"/><text class="badge-t" x="374" y="252.5">3</text>
  <text class="t-b" x="396" y="253">되돌릴 수 있나</text>
  <text class="t-s" x="396" y="278">rm으로 지운 것은 휴지통에 남지 않는다</text>
  <text class="t-s" x="396" y="300">먼저</text>
  <text class="t-mono t-b" x="428" y="300">ls build/*</text>
  <text class="t-s" x="520" y="300">로 무엇이 걸리는지 본다</text>
</svg>
