<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg">
  <title>목록과 개수를 따로 저장하면 삭제 취소에서 개수 되돌리기를 빠뜨렸을 때 둘이 어긋나지만, 목록을 세어 구한 개수는 항상 맞는다</title>

  <circle class="badge" cx="238" cy="30" r="11"/><text class="badge-t" x="238" y="34.500">1</text>
  <text class="t-s t-b" x="256" y="35">처음</text>
  <circle class="badge" cx="414" cy="30" r="11"/><text class="badge-t" x="414" y="34.500">2</text>
  <text class="t-s t-b" x="432" y="35">순대 삭제</text>
  <circle class="badge" cx="604" cy="30" r="11"/><text class="badge-t" x="604" y="34.500">3</text>
  <text class="t-s t-b" x="622" y="35">삭제 취소</text>

  <text class="t-mono t-b" x="20" y="80">items</text>
  <text class="t-s" x="20" y="100">원본 목록</text>
  <rect class="box green" x="185" y="62" width="54" height="36" rx="8"/>
  <text class="t-s mid" x="212" y="85">김밥</text>
  <rect class="box green" x="245" y="62" width="54" height="36" rx="8"/>
  <text class="t-s mid" x="272" y="85">떡볶이</text>
  <rect class="box green" x="305" y="62" width="54" height="36" rx="8"/>
  <text class="t-s mid" x="332" y="85">순대</text>
  <rect class="box green" x="375" y="62" width="54" height="36" rx="8"/>
  <text class="t-s mid" x="402" y="85">김밥</text>
  <rect class="box green" x="435" y="62" width="54" height="36" rx="8"/>
  <text class="t-s mid" x="462" y="85">떡볶이</text>
  <rect class="ghost dash" x="495" y="62" width="54" height="36" rx="8"/>
  <rect class="box green" x="565" y="62" width="54" height="36" rx="8"/>
  <text class="t-s mid" x="592" y="85">김밥</text>
  <rect class="box green" x="625" y="62" width="54" height="36" rx="8"/>
  <text class="t-s mid" x="652" y="85">떡볶이</text>
  <rect class="box warm" x="685" y="62" width="54" height="36" rx="8"/>
  <text class="t-s t-b mid" x="712" y="85">순대</text>

  <text class="t-mono t-b" x="20" y="158">count</text>
  <text class="t-s" x="20" y="178">따로 저장한 개수</text>
  <rect class="box" x="185" y="138" width="174" height="48" rx="10"/>
  <text class="t-mono t-b mid" x="272" y="167">3</text>
  <rect class="box" x="375" y="138" width="174" height="48" rx="10"/>
  <text class="t-mono t-b mid" x="462" y="167">2</text>
  <rect class="box red" x="565" y="138" width="174" height="48" rx="10"/>
  <text class="t-mono t-b tc-red" x="584" y="167">2</text>
  <text class="t-xs t-b tc-red" x="606" y="166">되돌리는 줄을 깜빡</text>

  <text class="t-mono t-b" x="20" y="234">items.length</text>
  <text class="t-s" x="20" y="254">그때그때 센 개수</text>
  <rect class="box green" x="185" y="214" width="174" height="48" rx="10"/>
  <text class="t-mono t-b mid" x="272" y="243">3</text>
  <rect class="box green" x="375" y="214" width="174" height="48" rx="10"/>
  <text class="t-mono t-b mid" x="462" y="243">2</text>
  <rect class="box green" x="565" y="214" width="174" height="48" rx="10"/>
  <text class="t-mono t-b mid" x="652" y="243">3</text>

  <text class="t-s" x="185" y="296">저장한 count는 한 군데만 빠뜨려도 어긋나고, 센 개수는 늘 원본과 맞는다</text>
</svg>
