  <path class="ln muted" d="M70 103 V136" marker-end="url(#ah-muted)"/>
  <path class="ln muted" d="M194 103 V136" marker-end="url(#ah-muted)"/>
  <path class="ln muted" d="M318 103 V136" marker-end="url(#ah-muted)"/>
