  <path class="ln blue" d="M247 188 H263" marker-end="url(#ah-blue)"/>
  <path class="ln blue" d="M371 188 H387" marker-end="url(#ah-blue)"/>
  <path class="ln blue" d="M495 188 H511" marker-end="url(#ah-blue)"/>
  <path class="ln blue" d="M619 188 H635" marker-end="url(#ah-blue)"/>

  <text class="t-s" x="20" y="262"><tspan class="t-b">패킷은 라우터를 건너 건너.</tspan> 각 라우터는 목적지 주소를 보고 다음에 넘길 곳만 고른다</text>
