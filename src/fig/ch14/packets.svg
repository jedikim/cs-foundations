  <rect class="solid green" x="570" y="178" width="30" height="30" rx="6"/><text class="t-on t-b mid" x="585" y="198">1</text>
  <rect class="solid green" x="610" y="178" width="30" height="30" rx="6"/><text class="t-on t-b mid" x="625" y="198">2</text>
  <rect class="solid green" x="650" y="178" width="30" height="30" rx="6"/><text class="t-on t-b mid" x="665" y="198">3</text>
  <rect class="solid green" x="690" y="178" width="30" height="30" rx="6"/><text class="t-on t-b mid" x="705" y="198">4</text>
  <rect class="solid green" x="570" y="224" width="150" height="30" rx="6"/>
  <text class="t-on t-b mid" x="645" y="244">사진 한 장</text>
</svg>
