<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg">
  <title>IP 주소는 건물 주소, 포트는 그 건물 안의 호수에 해당한다</title>

  <rect class="box yellow" x="20" y="88" width="240" height="140" rx="14"/>
  <use href="#i-mail" x="34" y="100" width="36" height="36" class="ic yellow"/>
  <text class="t-l" x="80" y="125">받는 곳</text>
  <text class="t-mono t-b" x="40" y="172">203.0.113.9</text>
  <text class="t-mono t-b" x="140" y="172">:</text>
  <text class="t-mono t-b tc-warm" x="158" y="172">443</text>
  <path class="ln thin" d="M40 181 H132"/>
  <path class="ln thin warm" d="M158 181 H184"/>
  <text class="t-xs" x="40" y="202">건물 주소 (IP)</text>
  <text class="t-xs tc-warm" x="158" y="202">호수 (포트)</text>

  <rect class="panel" x="320" y="20" width="420" height="284" rx="16"/>
  <use href="#i-building" x="338" y="30" width="40" height="40" class="ic gray"/>
  <text class="t-l" x="388" y="48">서버 한 대 = 건물 한 채</text>
  <text class="t-mono" x="388" y="69">IP 203.0.113.9</text>

  <rect class="box" x="340" y="84" width="380" height="44" rx="10"/>
  <text class="t-mono t-b" x="356" y="111">포트 22</text>
  <text class="t-b" x="450" y="111">SSH 서버</text>
  <text class="t-s" x="570" y="111">원격 접속</text>

  <rect class="box green" x="340" y="136" width="380" height="44" rx="10"/>
  <text class="t-mono t-b tc-warm" x="356" y="163">포트 443</text>
  <text class="t-b" x="450" y="163">웹 서버</text>
  <text class="t-s" x="570" y="163">웹 페이지와 API</text>

  <rect class="box" x="340" y="188" width="380" height="44" rx="10"/>
  <text class="t-mono t-b" x="356" y="215">포트 5432</text>
  <text class="t-b" x="450" y="215">데이터베이스</text>
  <text class="t-s" x="570" y="215">자료 보관</text>

  <rect class="ghost dash" x="340" y="240" width="380" height="44" rx="10"/>
  <text class="t-mono t-b tc-muted" x="356" y="267">포트 8080</text>
  <text class="t-s" x="450" y="267">빈 방 — 기다리는 프로그램 없음</text>
  <path class="ln blue thick" d="M266 158 H328" marker-end="url(#ah-blue)"/>
</svg>
