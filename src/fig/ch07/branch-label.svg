<svg viewBox="0 0 760 476" xmlns="http://www.w3.org/2000/svg">
  <title>브랜치는 커밋을 가리키는 이름표이고, 새 커밋을 만들면 HEAD가 붙은 이름표만 앞으로 옮겨 간다</title>
  <rect class="panel" x="20" y="16" width="720" height="140" rx="16"/>
  <circle class="badge blue" cx="48" cy="52" r="12"/><text class="badge-t" x="48" y="56.5">1</text>
  <text class="t-b" x="70" y="57">처음 상태</text>
  <text class="t-s" x="40" y="88">main 이름표가 B에 붙어 있다</text>
  <text class="t-s" x="40" y="110">HEAD는 내가 선 곳을 알려 준다</text>
  <path class="ln" d="M428 86 L492 86"/>
  <circle class="box green" cx="410" cy="86" r="18"/><text class="t-mono t-b mid" x="410" y="91">A</text>
  <circle class="box green" cx="510" cy="86" r="18"/><text class="t-mono t-b mid" x="510" y="91">B</text>
  <rect class="box blue" x="482" y="26" width="56" height="24" rx="6"/><text class="t-mono t-b mid" x="510" y="43">main</text><path class="ln blue" d="M510 51 V64" marker-end="url(#ah-blue)"/>
  <rect class="solid" x="556" y="26" width="50" height="24" rx="12"/><text class="t-mono t-b t-on mid" x="581" y="43">HEAD</text><path class="ln" d="M555 38 H542" marker-end="url(#ah)"/>

  <rect class="panel" x="20" y="168" width="720" height="140" rx="16"/>
  <circle class="badge blue" cx="48" cy="204" r="12"/><text class="badge-t" x="48" y="208.5">2</text>
  <text class="t-mono t-b" x="70" y="209">git switch -c jump</text>
  <text class="t-s" x="40" y="240">이름표 jump를 하나 더 붙이고</text>
  <text class="t-s" x="40" y="262">HEAD를 그쪽으로 옮긴다</text>
  <path class="ln" d="M428 238 L492 238"/>
  <circle class="box green" cx="410" cy="238" r="18"/><text class="t-mono t-b mid" x="410" y="243">A</text>
  <circle class="box green" cx="510" cy="238" r="18"/><text class="t-mono t-b mid" x="510" y="243">B</text>
  <rect class="box blue" x="482" y="178" width="56" height="24" rx="6"/><text class="t-mono t-b mid" x="510" y="195">main</text><path class="ln blue" d="M510 203 V216" marker-end="url(#ah-blue)"/>
  <rect class="box warm" x="482" y="274" width="56" height="24" rx="6"/><text class="t-mono t-b mid" x="510" y="291">jump</text><path class="ln warm" d="M510 273 V260" marker-end="url(#ah-warm)"/>
  <rect class="solid" x="556" y="274" width="50" height="24" rx="12"/><text class="t-mono t-b t-on mid" x="581" y="291">HEAD</text><path class="ln" d="M555 286 H542" marker-end="url(#ah)"/>

  <rect class="panel" x="20" y="320" width="720" height="140" rx="16"/>
  <circle class="badge blue" cx="48" cy="356" r="12"/><text class="badge-t" x="48" y="360.5">3</text>
  <text class="t-mono t-b" x="70" y="361">git commit</text>
  <text class="t-s" x="40" y="392">새 커밋 C가 B 뒤에 생기고</text>
  <text class="t-s" x="40" y="414">HEAD가 붙은 jump만 따라간다</text>
  <path class="ln" d="M428 390 L492 390"/>
  <path class="ln" d="M528 390 L592 390"/>
  <circle class="box green" cx="410" cy="390" r="18"/><text class="t-mono t-b mid" x="410" y="395">A</text>
  <circle class="box green" cx="510" cy="390" r="18"/><text class="t-mono t-b mid" x="510" y="395">B</text>
  <circle class="box warm" cx="610" cy="390" r="18"/><text class="t-mono t-b mid" x="610" y="395">C</text>
  <rect class="box blue" x="482" y="330" width="56" height="24" rx="6"/><text class="t-mono t-b mid" x="510" y="347">main</text><path class="ln blue" d="M510 355 V368" marker-end="url(#ah-blue)"/>
  <rect class="box warm" x="582" y="426" width="56" height="24" rx="6"/><text class="t-mono t-b mid" x="610" y="443">jump</text><path class="ln warm" d="M610 425 V412" marker-end="url(#ah-warm)"/>
  <rect class="solid" x="656" y="426" width="50" height="24" rx="12"/><text class="t-mono t-b t-on mid" x="681" y="443">HEAD</text><path class="ln" d="M655 438 H642" marker-end="url(#ah)"/>

</svg>
