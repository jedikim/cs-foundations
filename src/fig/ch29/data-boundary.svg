<svg viewBox="0 0 760 366" xmlns="http://www.w3.org/2000/svg">
  <title>코딩 에이전트는 내 컴퓨터에서 돌지만, 읽은 파일과 명령 출력은 모델이 있는 바깥 서버로 전송된다. 읽지 못하게 막은 파일만 나가지 않는다</title>

  <rect class="panel" x="20" y="20" width="450" height="270" rx="14"/>
  <text class="t-b" x="36" y="46">내 컴퓨터</text>

  <rect class="box" x="36" y="62" width="214" height="56" rx="10"/>
  <use href="#i-file" x="46" y="74" width="32" height="32" class="ic"/>
  <text class="t-mono" x="88" y="86">cart.py</text>
  <text class="t-xs" x="88" y="105">소스 코드</text>

  <rect class="box warm" x="36" y="130" width="214" height="56" rx="10"/>
  <use href="#i-terminal" x="46" y="142" width="32" height="32" class="ic warm"/>
  <text class="t-b" x="88" y="154">테스트 출력</text>
  <text class="t-xs" x="88" y="173">주문자: 김하늘 …</text>

  <rect class="box red" x="36" y="198" width="214" height="56" rx="10"/>
  <use href="#i-lock" x="46" y="210" width="32" height="32" class="ic red"/>
  <text class="t-mono" x="88" y="222">.env</text>
  <text class="t-xs" x="88" y="241">DB 비밀번호</text>

  <rect class="box blue" x="326" y="106" width="128" height="104" rx="12"/>
  <use href="#i-gear" x="370" y="116" width="40" height="40" class="ic blue"/>
  <text class="t-b mid" x="390" y="178">에이전트 도구</text>
  <text class="t-xs mid" x="390" y="197">읽고, 실행한다</text>

  <path class="ln blue" d="M254 90 H290 V134 H320" marker-end="url(#ah-blue)"/>
  <path class="ln warm" d="M254 158 H320" marker-end="url(#ah-warm)"/>
  <path class="ln red" d="M254 226 H284"/>
  <use href="#i-cross" x="288" y="214" width="24" height="24" class="ic red"/>
  <text class="t-xs t-b tc-red" x="318" y="231">읽기 차단</text>

  <rect class="panel purple" x="540" y="20" width="200" height="270" rx="14"/>
  <text class="t-b" x="556" y="46">바깥: 모델 서버</text>
  <use href="#i-cloud" x="618" y="54" width="44" height="44" class="ic purple"/>
  <text class="t-xs" x="556" y="122">여기까지 도착한 것</text>

  <rect class="box" x="556" y="132" width="168" height="36" rx="8"/>
  <text class="t-s t-ink" x="568" y="155">cart.py 내용</text>
  <rect class="box warm" x="556" y="178" width="168" height="36" rx="8"/>
  <text class="t-s t-ink" x="568" y="201">테스트 출력 (김하늘)</text>
  <rect class="ghost dash" x="556" y="224" width="168" height="36" rx="8"/>
  <text class="t-s" x="568" y="247">.env는 오지 않음</text>

  <path class="ln purple" d="M458 150 H548" marker-end="url(#ah-purple)"/>
  <text class="t-xs t-b tc-purple mid" x="505" y="140">전송</text>

  <rect class="box yellow" x="20" y="304" width="720" height="46" rx="12"/>
  <text class="t-b mid" x="380" y="333">에이전트가 읽은 것은 밖으로 나갑니다. 읽을 범위부터 좁힙니다.</text>
</svg>
