<svg viewBox="0 0 760 372" xmlns="http://www.w3.org/2000/svg">
  <title>RAG는 문서를 미리 모으고 쪼개고 임베딩해 색인에 넣어 두었다가, 질문이 오면 후보를 넓게 찾고 다시 골라 근거와 함께 답하게 한다</title>

  <rect class="panel" x="20" y="20" width="720" height="152" rx="14"/>
  <text class="t-b" x="36" y="46">미리 해 두는 일</text>
  <text class="t-s" x="152" y="46">문서가 바뀔 때마다 다시</text>

  <rect class="box" x="36" y="60" width="150" height="98" rx="12"/>
  <text class="t-s t-b" x="50" y="84">모으기</text>
  <text class="t-l mid" x="111" y="118">문서 3개</text>
  <text class="t-xs mid" x="111" y="141">환불·배송·교환 규정</text>

  <rect class="box" x="215" y="60" width="150" height="98" rx="12"/>
  <text class="t-s t-b" x="229" y="84">쪼개기</text>
  <text class="t-l mid" x="290" y="118">조각 42개</text>
  <text class="t-xs mid" x="290" y="141">제목을 붙여 뜻 단위로</text>

  <rect class="box" x="394" y="60" width="150" height="98" rx="12"/>
  <text class="t-s t-b" x="408" y="84">임베딩</text>
  <text class="t-l mid" x="469" y="118">벡터 42개</text>
  <text class="t-xs mid" x="469" y="141">[0.21, -0.70, …]</text>

  <rect class="box green" x="573" y="60" width="150" height="98" rx="12"/>
  <text class="t-s t-b" x="587" y="84">저장</text>
  <text class="t-l mid" x="648" y="118">색인</text>
  <text class="t-xs mid" x="648" y="141">조각 + 벡터 + 출처</text>

  <path class="ln" d="M190 109 H209" marker-end="url(#ah)"/>
  <path class="ln" d="M369 109 H388" marker-end="url(#ah)"/>
  <path class="ln" d="M548 109 H567" marker-end="url(#ah)"/>

  <rect class="panel" x="20" y="196" width="720" height="156" rx="14"/>
  <text class="t-b" x="36" y="222">질문이 올 때마다</text>
  <path class="ln green" d="M648 162 V184 H290 V228" marker-end="url(#ah-green)"/>

  <rect class="box blue" x="36" y="236" width="150" height="100" rx="12"/>
  <text class="t-s t-b" x="50" y="260">질문</text>
  <text class="t-b mid" x="111" y="289">“맞춤 머그컵도</text>
  <text class="t-b mid" x="111" y="311">환불되나요?”</text>

  <rect class="box green" x="215" y="236" width="150" height="100" rx="12"/>
  <text class="t-s t-b" x="229" y="260">검색</text>
  <text class="t-l mid" x="290" y="294">후보 20개</text>
  <text class="t-xs mid" x="290" y="317">키워드 + 의미 검색</text>

  <rect class="box warm" x="394" y="236" width="150" height="100" rx="12"/>
  <text class="t-s t-b" x="408" y="260">재순위</text>
  <text class="t-l mid" x="469" y="294">상위 3개</text>
  <text class="t-xs mid" x="469" y="317">질문과 다시 비교</text>

  <rect class="box purple" x="573" y="236" width="150" height="100" rx="12"/>
  <text class="t-s t-b" x="587" y="260">답변</text>
  <text class="t-l mid" x="648" y="294">환불 불가</text>
  <text class="t-xs mid" x="648" y="317">근거: 환불 규정 3조</text>

  <path class="ln" d="M190 286 H209" marker-end="url(#ah)"/>
  <path class="ln" d="M369 286 H388" marker-end="url(#ah)"/>
  <path class="ln" d="M548 286 H567" marker-end="url(#ah)"/>
</svg>
