<svg viewBox="0 0 760 350" xmlns="http://www.w3.org/2000/svg">
  <title>모델이 낸 주문서는 문법, 스키마, 업무 규칙, 권한 검사를 차례로 지나야 실행된다. 수량 -2는 스키마를 통과하고도 업무 규칙에서 멈춘다</title>

  <use href="#i-robot" x="20" y="22" width="40" height="40" class="ic purple"/>
  <text class="t-b" x="70" y="40">모델이 낸 주문서</text>
  <text class="t-s" x="70" y="60">손님: “머그컵 두 개 빼 주세요”</text>
  <path class="ln purple" d="M296 44 H427" marker-end="url(#ah-purple)"/>
  <rect class="box purple" x="435" y="24" width="300" height="40" rx="10"/>
  <text class="t-mono mid" x="585" y="49">{"item_id": 7, "quantity": -2}</text>
  <path class="ln purple" d="M585 68 V108" marker-end="url(#ah-purple)"/>

  <text class="t-s t-b" x="20" y="96">네 겹의 검사</text>
  <text class="t-s t-b" x="310" y="96">여기서 걸리는 예</text>

  <rect class="box green" x="20" y="108" width="270" height="48" rx="10"/>
  <circle class="badge green" cx="44" cy="132" r="12"/><text class="badge-t" x="44" y="136.500">1</text>
  <text class="t-b" x="64" y="137">문법</text>
  <text class="t-s" x="150" y="137">JSON으로 읽히는가</text>
  <text x="310" y="137">괄호가 닫히지 않은 JSON</text>
  <rect class="solid green" x="540" y="116" width="90" height="32" rx="16"/>
  <text class="t-b t-on mid" x="585" y="137">통과</text>

  <path class="ln green" d="M585 152 V168" marker-end="url(#ah-green)"/>

  <rect class="box green" x="20" y="166" width="270" height="48" rx="10"/>
  <circle class="badge green" cx="44" cy="190" r="12"/><text class="badge-t" x="44" y="194.500">2</text>
  <text class="t-b" x="64" y="195">스키마</text>
  <text class="t-s" x="150" y="195">칸과 자료형이 맞는가</text>
  <text class="t-mono" x="310" y="195">"quantity": "두 개"</text>
  <rect class="solid green" x="540" y="174" width="90" height="32" rx="16"/>
  <text class="t-b t-on mid" x="585" y="195">통과</text>
  <text class="t-xs" x="642" y="194">-2도 정수라서</text>

  <path class="ln green" d="M585 210 V226" marker-end="url(#ah-green)"/>

  <rect class="box red" x="20" y="224" width="270" height="48" rx="10"/>
  <circle class="badge red" cx="44" cy="248" r="12"/><text class="badge-t" x="44" y="252.500">3</text>
  <text class="t-b" x="64" y="253">업무 규칙</text>
  <text class="t-s" x="150" y="253">값이 말이 되는가</text>
  <text class="t-mono t-b tc-red" x="310" y="253">"quantity": -2</text>
  <rect class="solid red" x="540" y="232" width="90" height="32" rx="16"/>
  <text class="t-b t-on mid" x="585" y="253">멈춤</text>
  <text class="t-xs tc-red" x="642" y="252">실행하지 않음</text>

  <rect class="box gray" x="20" y="282" width="270" height="48" rx="10"/>
  <circle class="badge" cx="44" cy="306" r="12"/><text class="badge-t" x="44" y="310.500">4</text>
  <text class="t-b" x="64" y="311">권한</text>
  <text class="t-s" x="150" y="311">해도 되는 사람인가</text>
  <text x="310" y="311">남의 주문을 취소하려 함</text>
  <rect class="ghost dash" x="540" y="290" width="90" height="32" rx="16"/>
  <text class="t-s mid" x="585" y="311">오지 않음</text>
</svg>
