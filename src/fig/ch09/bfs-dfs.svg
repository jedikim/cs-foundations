<svg viewBox="0 0 760 316" xmlns="http://www.w3.org/2000/svg">
  <title>같은 지도에서 너비 우선 탐색은 가까운 칸부터 퍼져 4걸음 길을 찾고 깊이 우선 탐색은 한 길로 끝까지 가서 10걸음 길을 찾는다</title>
  <text class="t-s t-b" x="40" y="30">너비 우선(BFS): 가까운 칸부터 물결처럼</text>
  <text class="t-s" x="40" y="50">숫자 = 출발점에서 몇 걸음 떨어졌나</text>
  <text class="t-s t-b" x="500" y="30">깊이 우선(DFS): 한 길로 끝까지</text>
  <text class="t-s" x="500" y="50">숫자 = 들른 순서</text>
  <rect class="solid blue" x="40" y="70" width="44" height="44"/>
  <text class="t-l mid t-on" x="62" y="98">0</text>
  <rect class="box blue" x="84" y="70" width="44" height="44"/>
  <text class="t-l mid" x="106" y="98">1</text>
  <rect class="box blue" x="128" y="70" width="44" height="44"/>
