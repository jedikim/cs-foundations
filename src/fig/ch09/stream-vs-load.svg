<svg viewBox="0 0 760 352" xmlns="http://www.w3.org/2000/svg">
  <title>10GB 로그를 통째로 읽으면 8GB 메모리가 넘치지만 한 줄씩 읽으면 한 줄만큼만 쓴다</title>
  <rect class="panel" x="20" y="16" width="720" height="150" rx="14"/>
  <text class="t-l" x="40" y="46">통째로 읽기</text>
  <text class="t-mono" x="140" y="46">lines = f.readlines()</text>
  <use href="#i-disk" x="52" y="62" width="44" height="44" class="ic warm"/>
  <text class="t-mono mid" x="74" y="126">server.log</text>
  <text class="t-s mid" x="74" y="146">디스크에 10GB</text>
  <path class="ln thick red" d="M132 96 H252" marker-end="url(#ah-red)"/>
  <text class="t-s mid" x="192" y="86">10GB 전부</text>
  <text class="t-s" x="270" y="68">메모리(조리대) 8GB</text>
  <rect class="ghost" x="270" y="78" width="320" height="38" rx="6"/>
  <rect class="solid red" x="270" y="78" width="400" height="38" rx="6"/>
  <text class="t-on t-b mid" x="430" y="102">로그 10GB</text>
  <path class="ln thin dash" d="M590 70 V126"/>
  <text class="t-xs end" x="584" y="68">여기까지 8GB</text>
  <text class="t-b tc-red mid" x="630" y="138">2GB 넘침</text>
  <text class="t-s" x="270" y="146">파일이 커지면 메모리도 그만큼 필요</text>
  <rect class="panel" x="20" y="186" width="720" height="150" rx="14"/>
  <text class="t-l" x="40" y="216">한 줄씩 읽기</text>
  <text class="t-mono" x="148" y="216">for line in f:</text>
  <use href="#i-disk" x="52" y="232" width="44" height="44" class="ic warm"/>
  <text class="t-mono mid" x="74" y="296">server.log</text>
  <text class="t-s mid" x="74" y="316">디스크에 10GB</text>
  <path class="ln thick green" d="M132 266 H252" marker-end="url(#ah-green)"/>
  <rect class="box green" x="140" y="244" width="26" height="12" rx="3"/>
  <rect class="box green" x="174" y="244" width="26" height="12" rx="3"/>
  <rect class="box green" x="208" y="244" width="26" height="12" rx="3"/>
  <text class="t-s mid" x="192" y="290">한 번에 한 줄</text>
  <text class="t-s" x="270" y="238">메모리(조리대) 8GB</text>
  <rect class="ghost" x="270" y="248" width="320" height="38" rx="6"/>
  <rect class="solid green" x="270" y="248" width="6" height="38" rx="2"/>
  <text class="t-s" x="288" y="272">지금 읽는 한 줄 (약 1KB)</text>
  <rect class="box green" x="612" y="248" width="110" height="38" rx="8"/>
  <text class="t-mono mid" x="667" y="272">count = 3</text>
  <text class="t-s mid" x="667" y="238">세는 값 하나</text>
  <text class="t-s" x="270" y="316">파일이 100GB가 되어도 메모리는 그대로</text>
</svg>
