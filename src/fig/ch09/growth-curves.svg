<svg viewBox="0 0 760 366" xmlns="http://www.w3.org/2000/svg">
  <title>데이터 개수 n이 커질 때 걸음 수가 늘어나는 다섯 가지 모양: n의 제곱은 치솟고 로그는 거의 눕는다</title>
  <text class="t-s t-b" x="20" y="34">걸음 수</text>
