  <text class="t-xs end" x="60" y="184">50</text>
  <path class="ln thin muted" d="M70 115 H520"/>
  <text class="t-xs end" x="60" y="119">75</text>
  <path class="ln thin muted" d="M70 50 H520"/>
  <text class="t-xs end" x="60" y="54">100</text>
