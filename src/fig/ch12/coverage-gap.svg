<svg viewBox="0 0 760 296" xmlns="http://www.w3.org/2000/svg">
  <title>shipping(True)만 실행하면 다섯 줄을 모두 지나가 줄 커버리지는 100%지만, 비회원 갈래는 한 번도 가지 않았고 결과가 맞는지 확인한 적도 없다</title>

  <text class="t-mono t-b" x="20" y="32">shipping(True)</text>
  <text class="t-b" x="140" y="32">를 한 번 부르기만 한 테스트</text>

  <rect class="panel" x="20" y="46" width="400" height="174" rx="12"/>
  <rect class="solid green" x="30" y="60" width="6" height="22" rx="3"/>
  <rect class="solid green" x="30" y="90" width="6" height="22" rx="3"/>
  <rect class="solid green" x="30" y="120" width="6" height="22" rx="3"/>
  <rect class="solid green" x="30" y="150" width="6" height="22" rx="3"/>
  <rect class="solid green" x="30" y="180" width="6" height="22" rx="3"/>

  <text class="t-mono" x="50" y="76">def shipping(member):</text>
  <text class="t-mono" x="84" y="106">fee = 3000</text>
  <text class="t-mono t-b" x="84" y="136">if member:</text>
  <text class="t-mono" x="118" y="166">fee = 0</text>
  <text class="t-mono" x="84" y="196">return fee</text>

  <text class="t-s t-b tc-green" x="196" y="166">참: 지나감</text>
  <path class="ln red dash" d="M176 131 H296 V191 H178" marker-end="url(#ah-red)"/>
  <text class="t-s t-b tc-red" x="306" y="156">거짓인 길:</text>
  <text class="t-s t-b tc-red" x="306" y="176">한 번도 안 감</text>

  <text class="t-b" x="450" y="66">줄 커버리지</text>
  <text class="t-mono t-b end tc-green" x="740" y="66">100%</text>
  <rect class="solid green" x="450" y="76" width="290" height="14" rx="5"/>
  <text class="t-xs" x="450" y="108">5줄 모두 지나감</text>

  <text class="t-b" x="450" y="138">분기 커버리지</text>
  <text class="t-mono t-b end tc-warm" x="740" y="138">50%</text>
  <rect class="s-gray" x="450" y="148" width="290" height="14" rx="5"/>
  <rect class="solid warm" x="450" y="148" width="145" height="14" rx="5"/>
  <text class="t-xs" x="450" y="180">두 갈래 중 한 갈래만</text>

  <text class="t-b" x="450" y="210">결과 확인 (assert)</text>
  <text class="t-mono t-b end tc-red" x="740" y="210">0개</text>
  <rect class="s-gray" x="450" y="220" width="290" height="14" rx="5"/>
  <text class="t-xs" x="450" y="252">값이 맞는지 본 적 없음</text>

  <text class="t-b mid" x="380" y="280">100%는 “모든 줄을 지나갔다”일 뿐, “결과가 맞다”가 아니다</text>
</svg>
