<svg viewBox="0 0 760 312" xmlns="http://www.w3.org/2000/svg">
  <title>나쁜 로그는 문장 하나뿐이지만, 좋은 로그는 언제, 얼마나 급한가, 누가, 무엇을, 결과를 이름표 붙은 항목으로 나눠 적는다</title>

  <text class="t-b tc-red" x="20" y="45">나쁜 로그</text>
  <rect class="box red" x="110" y="22" width="150" height="38" rx="10"/>
  <text class="t-mono" x="126" y="46">결제 실패!!</text>
  <text class="t-s" x="280" y="45">언제? 어느 요청에서? 왜? 아무것도 알 수 없다</text>

  <text class="t-b tc-green" x="20" y="100">좋은 로그</text>
  <text class="t-s" x="110" y="100">한 줄을 항목별로 뜯어 보면</text>

  <rect class="box green" x="20" y="116" width="110" height="60" rx="10"/>
  <text class="t-mono tc-muted mid" x="75" y="140">time</text>
  <text class="t-mono t-b mid" x="75" y="163">10:03:13</text>

  <rect class="box green" x="142" y="116" width="110" height="60" rx="10"/>
  <text class="t-mono tc-muted mid" x="197" y="140">level</text>
  <text class="t-mono t-b mid tc-red" x="197" y="163">ERROR</text>

  <rect class="box green" x="264" y="116" width="110" height="60" rx="10"/>
  <text class="t-mono tc-muted mid" x="319" y="140">request_id</text>
  <text class="t-mono t-b mid" x="319" y="163">r7</text>

  <rect class="box green" x="386" y="116" width="110" height="60" rx="10"/>
  <text class="t-mono tc-muted mid" x="441" y="140">event</text>
  <text class="t-mono t-b mid" x="441" y="163">pay_failed</text>

  <rect class="box green" x="508" y="116" width="110" height="60" rx="10"/>
  <text class="t-mono tc-muted mid" x="563" y="140">error_code</text>
  <text class="t-mono t-b mid" x="563" y="163">timeout</text>

  <rect class="box green" x="630" y="116" width="110" height="60" rx="10"/>
  <text class="t-mono tc-muted mid" x="685" y="140">duration_ms</text>
  <text class="t-mono t-b mid" x="685" y="163">3000</text>

  <path class="ln thin muted" d="M75 181 V198"/>
  <path class="ln thin muted" d="M197 181 V198"/>
  <path class="ln thin muted" d="M319 181 V198"/>
  <path class="ln thin muted" d="M441 181 V198"/>
  <path class="ln thin muted" d="M563 181 V189 H685 V181 M624 189 V198"/>

  <text class="t-b mid" x="75" y="220">언제</text>
  <text class="t-s mid" x="75" y="241">일어난 시각</text>
  <text class="t-b mid" x="197" y="220">얼마나 급한가</text>
  <text class="t-s mid" x="197" y="241">로그 수준</text>
  <text class="t-b mid" x="319" y="220">누가</text>
  <text class="t-s mid" x="319" y="241">어느 요청인지</text>
  <text class="t-b mid" x="441" y="220">무엇을</text>
  <text class="t-s mid" x="441" y="241">사건의 이름</text>
  <text class="t-b mid" x="624" y="220">결과</text>
  <text class="t-s mid" x="624" y="241">왜 실패했고 몇 ms 걸렸나</text>

  <rect class="box yellow" x="20" y="262" width="720" height="36" rx="10"/>
  <text class="mid" x="380" y="285">항목마다 이름표가 붙어 있어 프로그램이 골라내고 셀 수 있다</text>
</svg>
