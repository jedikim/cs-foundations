<svg viewBox="0 0 760 384" xmlns="http://www.w3.org/2000/svg">
  <title>자동차 계기판, 블랙박스, 택배 송장 조회는 각각 지표, 로그, 추적에 대응하며 서로 다른 질문에 답한다</title>

  <rect class="box yellow" x="20" y="20" width="226" height="70" rx="12"/>
  <g class="ic yellow">
    <path class="i-f" d="M36 66 A19 19 0 0 1 74 66 Z"/>
    <path class="i-s" d="M55 66 L66 53"/>
    <circle class="i-d" cx="55" cy="66" r="2.500"/>
  </g>
  <text class="t-l" x="88" y="50">계기판</text>
  <text class="t-s" x="88" y="72">지금 속도와 연료</text>

  <rect class="box yellow" x="267" y="20" width="226" height="70" rx="12"/>
  <use href="#i-car" x="281" y="35" width="40" height="40" class="ic yellow"/>
  <text class="t-l" x="335" y="50">블랙박스</text>
  <text class="t-s" x="335" y="72">사건마다 남는 기록</text>

  <rect class="box yellow" x="514" y="20" width="226" height="70" rx="12"/>
  <use href="#i-truck" x="528" y="35" width="40" height="40" class="ic yellow"/>
  <text class="t-l" x="582" y="50">택배 송장 조회</text>
  <text class="t-s" x="582" y="72">어디를 언제 지났나</text>

  <path class="ln muted" d="M133 95 V114" marker-end="url(#ah-muted)"/>
  <path class="ln muted" d="M380 95 V114" marker-end="url(#ah-muted)"/>
  <path class="ln muted" d="M627 95 V114" marker-end="url(#ah-muted)"/>

  <rect class="box blue" x="20" y="122" width="226" height="242" rx="14"/>
  <text class="t-l" x="36" y="152">지표</text>
  <text class="t-s" x="78" y="152">metric</text>
  <text class="t-s" x="36" y="174">시간에 따라 변하는 숫자</text>
  <path class="ln thin muted" d="M40 300 H226"/>
  <path class="ln blue" d="M40 290 H140 L180 224 L226 208"/>
  <text class="t-xs" x="40" y="206">오류율</text>
  <text class="t-mono" x="58" y="280">0.2%</text>
  <text class="t-mono t-b tc-red end" x="224" y="198">5%</text>
  <text class="t-xs" x="40" y="318">10:00</text>
  <text class="t-xs mid" x="180" y="318">10:03</text>
  <text class="t-b mid" x="133" y="348">얼마나 자주 일어나나?</text>

  <rect class="box green" x="267" y="122" width="226" height="242" rx="14"/>
  <text class="t-l" x="283" y="152">로그</text>
  <text class="t-s" x="325" y="152">log</text>
  <text class="t-s" x="283" y="174">사건 하나하나의 기록</text>
  <rect class="box" x="281" y="190" width="198" height="116" rx="8"/>
  <text class="t-mono" x="293" y="214">10:03:13 ERROR</text>
  <text class="t-mono" x="293" y="238">event=pay_failed</text>
  <text class="t-mono" x="293" y="262">request_id=r7</text>
  <text class="t-mono" x="293" y="286">error=timeout</text>
  <text class="t-b mid" x="380" y="348">그때 무슨 일이, 왜?</text>

  <rect class="box warm" x="514" y="122" width="226" height="242" rx="14"/>
  <text class="t-l" x="530" y="152">추적</text>
  <text class="t-s" x="572" y="152">trace</text>
  <text class="t-s" x="530" y="174">요청 하나가 지나간 길</text>
  <text class="t-s" x="530" y="216">재고</text>
  <rect class="solid warm" x="566" y="202" width="6" height="18" rx="2"/>
  <text class="t-xs" x="580" y="216">40ms</text>
  <text class="t-s" x="530" y="250">결제</text>
  <rect class="solid red" x="574" y="236" width="138" height="18" rx="3"/>
  <text class="t-xs t-on t-b mid" x="643" y="249.500">1,100ms</text>
  <text class="t-s" x="530" y="284">저장</text>
  <rect class="solid warm" x="714" y="270" width="8" height="18" rx="2"/>
  <text class="t-xs end" x="706" y="284">60ms</text>
  <text class="t-b mid" x="627" y="348">어느 구간에서 느렸나?</text>
</svg>
