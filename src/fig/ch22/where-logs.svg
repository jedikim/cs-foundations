<svg viewBox="0 0 760 322" xmlns="http://www.w3.org/2000/svg">
  <title>화면 코드가 찍은 로그는 브라우저 콘솔에, 서버 코드가 찍은 로그는 내 컴퓨터에서는 터미널에, 인터넷에 올린 뒤에는 호스팅 서비스의 로그 화면에 나온다</title>

  <rect class="box blue" x="20" y="20" width="226" height="238" rx="14"/>
  <use href="#i-browser" x="34" y="32" width="34" height="34" class="ic blue"/>
  <text class="t-l" x="78" y="47">브라우저 콘솔</text>
  <text class="t-s" x="78" y="67">화면 코드가 찍은 글</text>
  <rect class="box" x="34" y="84" width="198" height="76" rx="8"/>
  <text class="t-mono" x="46" y="112">주문하기 눌림</text>
  <text class="t-mono t-b tc-red" x="46" y="142">POST /orders 500</text>
  <text class="t-b" x="36" y="192">F12 → Console 탭</text>
  <text class="t-s" x="36" y="216">그 화면을 연 사람만 본다</text>
  <text class="t-s" x="36" y="238">서버의 로그는 여기 없다</text>

  <rect class="box green" x="267" y="20" width="226" height="238" rx="14"/>
  <use href="#i-terminal" x="281" y="32" width="34" height="34" class="ic green"/>
  <text class="t-l" x="325" y="47">터미널</text>
  <text class="t-s" x="325" y="67">내 컴퓨터에서 켠 서버</text>
  <rect class="box" x="281" y="84" width="198" height="76" rx="8"/>
  <text class="t-mono" x="293" y="112">INFO order_received</text>
  <text class="t-mono t-b tc-red" x="293" y="142">ERROR pay_failed</text>
  <text class="t-b" x="283" y="192">서버를 켠 바로 그 창</text>
  <text class="t-s" x="283" y="216">찍히는 대로 바로 보인다</text>
  <text class="t-s" x="283" y="238">창을 닫으면 사라진다</text>

  <rect class="box warm" x="514" y="20" width="226" height="238" rx="14"/>
  <use href="#i-cloud" x="528" y="32" width="34" height="34" class="ic warm"/>
  <text class="t-l" x="572" y="47">로그 화면</text>
  <text class="t-s" x="572" y="67">인터넷에 올린 서버</text>
  <rect class="box" x="528" y="84" width="198" height="76" rx="8"/>
  <text class="t-mono" x="540" y="112">INFO order_received</text>
  <text class="t-mono t-b tc-red" x="540" y="142">ERROR pay_failed</text>
  <text class="t-b" x="530" y="192">호스팅 서비스의 Logs</text>
  <text class="t-s" x="530" y="216">몇 초 늦게 나타난다</text>
  <text class="t-s" x="530" y="238">기간이 지나면 지워진다</text>

  <rect class="box yellow" x="20" y="274" width="720" height="34" rx="10"/>
  <text class="mid" x="380" y="296">콘솔의 500은 "서버가 실패했다"까지만 알려 준다. 까닭은 서버의 로그에 있다</text>
</svg>
