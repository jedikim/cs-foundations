<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg">
  <title>카운터는 오르기만 하는 누적값, 게이지는 오르내리는 현재 값, 히스토그램은 구간별 건수다</title>

  <rect class="box blue" x="20" y="20" width="226" height="290" rx="14"/>
  <text class="t-l" x="36" y="50">카운터</text>
  <text class="t-s" x="94" y="50">counter</text>
  <text class="t-s" x="36" y="72">주행 거리계처럼 오르기만</text>
  <path class="ln thin muted" d="M36 232 H230"/>
  <path class="ln blue" d="M44 222 L84 212 L124 194 L164 166 L204 124"/>
  <circle class="f-blue" cx="164" cy="166" r="4.500"/>
  <circle class="f-blue" cx="204" cy="124" r="4.500"/>
  <text class="t-mono end" x="154" y="160">12,000</text>
  <text class="t-mono t-b mid" x="196" y="110">12,600</text>
  <text class="t-xs mid" x="164" y="250">10:00</text>
  <text class="t-xs mid" x="204" y="250">10:01</text>
  <text class="t-b tc-blue" x="36" y="276">1분 사이 +600건</text>
  <text class="t-s" x="36" y="296">예: 지금까지 받은 요청 수</text>

  <rect class="box green" x="267" y="20" width="226" height="290" rx="14"/>
  <text class="t-l" x="283" y="50">게이지</text>
  <text class="t-s" x="341" y="50">gauge</text>
  <text class="t-s" x="283" y="72">연료계처럼 오르내림</text>
  <path class="ln thin muted" d="M283 232 H477"/>
  <path class="ln green" d="M291 176 L321 136 L351 186 L381 146 L411 204 L441 172 L467 160"/>
  <circle class="f-green" cx="467" cy="160" r="4.500"/>
  <text class="t-mono t-b mid" x="455" y="142">42명</text>
  <text class="t-b tc-green" x="283" y="276">지금 이 순간 42명</text>
  <text class="t-s" x="283" y="296">예: 접속자 수, 메모리 사용량</text>

  <rect class="box warm" x="514" y="20" width="226" height="290" rx="14"/>
  <text class="t-l" x="530" y="50">히스토그램</text>
  <text class="t-s" x="530" y="72">구간마다 몇 건인지 세기</text>
  <path class="ln thin muted" d="M530 232 H724"/>
  <rect class="solid warm" x="536" y="132" width="36" height="100" rx="3"/>
  <rect class="solid warm" x="586" y="217" width="36" height="15" rx="3"/>
  <rect class="solid warm" x="636" y="224.500" width="36" height="7.500" rx="2"/>
  <rect class="solid red" x="686" y="229" width="36" height="3" rx="1"/>
  <text class="t-mono t-b mid" x="554" y="124">80</text>
  <text class="t-mono t-b mid" x="604" y="209">12</text>
  <text class="t-mono t-b mid" x="654" y="216">6</text>
  <text class="t-mono t-b mid tc-red" x="704" y="221">2</text>
  <text class="t-xs mid" x="554" y="250">~0.1초</text>
  <text class="t-xs mid" x="604" y="250">~0.3초</text>
  <text class="t-xs mid" x="654" y="250">~1초</text>
  <text class="t-xs mid" x="704" y="250">1초~</text>
  <text class="t-b tc-warm" x="530" y="276">응답 100건의 분포</text>
  <text class="t-s" x="530" y="296">예: 응답에 걸린 시간</text>
</svg>
