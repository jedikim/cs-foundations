<svg viewBox="0 0 760 306" xmlns="http://www.w3.org/2000/svg">
  <title>30일 동안 주문 100,000건에 목표 99.9%라면 실패해도 되는 양은 100건이고, 그중 62건을 이미 썼다</title>

  <text class="t-b" x="20" y="32">30일 동안의 주문 요청 100,000건</text>
  <text class="t-xs end" x="740" y="32">빨간 조각은 실제보다 크게 그림</text>
  <rect class="solid green" x="20" y="44" width="714" height="28" rx="5"/>
  <rect class="solid red" x="736" y="44" width="4" height="28" rx="1"/>
  <text class="t-on t-b" x="34" y="63">성공해야 하는 99.9% = 99,900건</text>

  <path class="ln thin muted dash" d="M736 75 L20 144 M740 75 V144"/>
  <text class="t-b end" x="724" y="132">오류 예산: 실패해도 되는 0.1% = 100건</text>

  <rect class="solid red" x="20" y="150" width="288" height="36" rx="5"/>
  <text class="t-on t-b mid" x="164" y="173">배포 실수 40건</text>
  <rect class="solid warm" x="310" y="150" width="156" height="36" rx="5"/>
  <text class="t-on t-b mid" x="388" y="173">결제사 지연 22건</text>
  <rect class="box green" x="468" y="150" width="272" height="36" rx="5"/>
  <text class="t-b tc-green mid" x="604" y="173">남은 예산 38건</text>

  <text class="t-xs" x="20" y="206">0건</text>
  <text class="t-xs mid" x="467" y="206">62건 씀</text>
  <text class="t-xs end" x="740" y="206">100건</text>

  <rect class="box green" x="20" y="226" width="350" height="60" rx="12"/>
  <use href="#i-play" x="32" y="240" width="32" height="32" class="ic green"/>
  <text class="t-b" x="76" y="251">예산이 남아 있으면</text>
  <text class="t-s" x="76" y="272">새 기능을 계속 내보낸다</text>

  <rect class="box red" x="390" y="226" width="350" height="60" rx="12"/>
  <use href="#i-stop" x="402" y="240" width="32" height="32" class="ic red"/>
  <text class="t-b" x="446" y="251">예산이 바닥나면</text>
  <text class="t-s" x="446" y="272">배포를 멈추고 안정화부터 한다</text>
</svg>
