<svg viewBox="0 0 760 350" xmlns="http://www.w3.org/2000/svg">
  <title>자료 없이 물으면 그럴듯한 답을 지어내지만, 관련 문서를 찾아 컨텍스트에 함께 넣어 주면 그 문서를 근거로 답한다</title>

  <!-- 왼쪽: 자료 없이 -->
  <rect class="panel" x="20" y="20" width="350" height="310" rx="14"/>
  <text class="t-l" x="36" y="50">자료 없이 묻기</text>

  <rect class="ghost dash" x="32" y="64" width="326" height="112" rx="10"/>
  <text class="t-xs end" x="348" y="98">컨텍스트</text>
  <rect class="box blue" x="44" y="74" width="230" height="38" rx="8"/>
  <text x="56" y="98">우리 가게 환불 기간은?</text>
  <rect class="ghost dash" x="44" y="122" width="302" height="44" rx="8"/>
  <text class="t-s mid" x="195" y="149">넣어 준 자료 없음</text>

  <path class="ln purple" d="M195 180 V196" marker-end="url(#ah-purple)"/>
  <rect class="box purple" x="135" y="202" width="120" height="36" rx="10"/>
  <use href="#i-robot" x="152" y="208" width="24" height="24" class="ic purple"/>
  <text class="t-b" x="184" y="225">LLM</text>
  <path class="ln purple" d="M195 242 V256" marker-end="url(#ah-purple)"/>

  <rect class="box red" x="44" y="262" width="302" height="38" rx="8"/>
  <text class="mid t-b" x="195" y="286">“보통 14일 이내입니다.”</text>
  <text class="t-s mid tc-red" x="195" y="320">그럴듯하지만 지어낸 답</text>

  <!-- 오른쪽: 자료와 함께 -->
  <rect class="panel" x="390" y="20" width="350" height="310" rx="14"/>
  <text class="t-l" x="406" y="50">자료를 찾아 함께 주기 (RAG)</text>

  <rect class="ghost dash" x="402" y="64" width="326" height="112" rx="10"/>
  <text class="t-xs end" x="718" y="98">컨텍스트</text>
  <rect class="box blue" x="414" y="74" width="230" height="38" rx="8"/>
  <text x="426" y="98">우리 가게 환불 기간은?</text>
  <rect class="box green" x="414" y="122" width="302" height="44" rx="8"/>
  <use href="#i-file" x="422" y="130" width="28" height="28" class="ic green"/>
  <text class="t-xs" x="458" y="140">검색으로 찾은 문서</text>
  <text x="458" y="159">환불 규정 2조: 구매 후 7일 이내</text>

  <path class="ln purple" d="M565 180 V196" marker-end="url(#ah-purple)"/>
  <rect class="box purple" x="505" y="202" width="120" height="36" rx="10"/>
  <use href="#i-robot" x="522" y="208" width="24" height="24" class="ic purple"/>
  <text class="t-b" x="554" y="225">LLM</text>
  <path class="ln purple" d="M565 242 V256" marker-end="url(#ah-purple)"/>

  <rect class="box green" x="414" y="262" width="302" height="38" rx="8"/>
  <text class="mid t-b" x="565" y="286">“7일 이내입니다. (환불 규정 2조)”</text>
  <text class="t-s mid tc-green" x="565" y="320">문서와 대조해 확인할 수 있는 답</text>
</svg>
