<svg viewBox="0 0 760 282" xmlns="http://www.w3.org/2000/svg">
  <title>LLM은 지금까지의 글 뒤에 올 조각마다 확률을 매기고, 그중 하나를 뽑아 뒤에 붙인다</title>

  <circle class="badge purple" cx="32" cy="30" r="12"/><text class="badge-t" x="32" y="34.500">1</text>
  <text class="t-s t-b" x="52" y="35">다음에 올 조각마다 확률을 매긴다</text>

  <!-- 지금까지의 글 -->
  <rect class="box" x="20" y="74" width="262" height="62" rx="12"/>
  <rect class="box blue" x="32" y="86" width="60" height="38" rx="8"/>
  <text class="mid" x="62" y="110">오늘</text>
  <rect class="box blue" x="98" y="86" width="60" height="38" rx="8"/>
  <text class="mid" x="128" y="110">날씨</text>
  <rect class="box blue" x="164" y="86" width="40" height="38" rx="8"/>
  <text class="mid" x="184" y="110">가</text>
  <rect class="ghost dash" x="210" y="86" width="60" height="38" rx="8"/>
  <text class="t-l mid tc-purple" x="240" y="111">?</text>
  <text class="t-s mid" x="151" y="158">지금까지의 글</text>

  <path class="ln purple" d="M288 105 H326" marker-end="url(#ah-purple)"/>

  <rect class="box purple" x="334" y="62" width="120" height="86" rx="14"/>
  <use href="#i-robot" x="374" y="70" width="40" height="40" class="ic purple"/>
  <text class="t-l mid" x="394" y="134">LLM</text>

  <path class="ln purple" d="M460 105 H498" marker-end="url(#ah-purple)"/>

  <!-- 후보와 확률 -->
  <text class="end" x="572" y="71">좋다</text>
  <rect class="solid purple" x="582" y="56" width="100" height="20" rx="4"/>
  <text class="t-mono" x="690" y="71">50%</text>

  <text class="end" x="572" y="101">흐리다</text>
  <rect class="solid gray" x="582" y="86" width="60" height="20" rx="4"/>
  <text class="t-mono" x="650" y="101">30%</text>

  <text class="end" x="572" y="131">춥다</text>
  <rect class="solid gray" x="582" y="116" width="30" height="20" rx="4"/>
  <text class="t-mono" x="620" y="131">15%</text>

  <text class="end" x="572" y="161">수상하다</text>
  <rect class="solid gray" x="582" y="146" width="10" height="20" rx="4"/>
  <text class="t-mono" x="600" y="161">5%</text>

  <text class="t-xs" x="512" y="188">실제 후보는 수만 개 — 네 개만 그렸습니다</text>

  <!-- 뽑아 붙이기 -->
  <circle class="badge purple" cx="32" cy="240" r="12"/><text class="badge-t" x="32" y="244.500">2</text>
  <text class="t-s t-b" x="52" y="245">하나를 뽑아 뒤에 붙인다</text>

  <rect class="box blue" x="232" y="221" width="60" height="38" rx="8"/>
  <text class="mid" x="262" y="245">오늘</text>
  <rect class="box blue" x="298" y="221" width="60" height="38" rx="8"/>
  <text class="mid" x="328" y="245">날씨</text>
  <rect class="box blue" x="364" y="221" width="40" height="38" rx="8"/>
  <text class="mid" x="384" y="245">가</text>
  <rect class="solid purple" x="410" y="221" width="60" height="38" rx="8"/>
  <text class="mid t-on t-b" x="440" y="245">좋다</text>
  <rect class="ghost dash" x="476" y="221" width="60" height="38" rx="8"/>
  <text class="t-l mid tc-purple" x="506" y="246">?</text>
  <text class="t-s" x="552" y="245">늘어난 글로 1번부터 다시</text>
</svg>
